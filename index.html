<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>خدني</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@500;700&family=Readex+Pro:wght@400;500;600&display=swap">
<style>
/* Khedni trial. Accounts and shared rides live in Firebase; routes and traffic come from Google Maps. */
:root{
  --bg:#F3F5F2;--surface:#FFFFFF;--ink:#0E1F1A;--muted:#4F5F59;--line:#DCE3DF;--seg:#E7ECE8;
  --brand:#0B5D4B;--brand-ink:#FFFFFF;--brand-soft:#D9EBE5;--brand-deep:#073F33;
  --sun:#F5B921;--sun-ink:#0E1F1A;--sun-soft:#FFF1C7;--sun-soft-ink:#3F3A22;
  --danger:#B3261E;--danger-soft:#FBE4E2;--route:#1A6FE0;
  --display:'Alexandria','Readex Pro',Tahoma,sans-serif;--body:'Readex Pro',Tahoma,'Segoe UI',sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;display:flex;flex-direction:column}
h1,h2,h3,p{margin:0}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.sub{font-size:13px;color:var(--muted)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 18px;border:0;border-radius:16px;font-size:16px;font-weight:600;width:100%}
.btn.pri{background:var(--brand);color:var(--brand-ink)}
.btn.sun{background:var(--sun);color:var(--sun-ink)}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.warn{background:transparent;border:1px solid var(--danger);color:var(--danger)}
.btn.sm{min-height:44px;width:auto;font-size:14px;border-radius:12px;padding:0 14px;flex:none}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.grow{flex:1 1 auto;min-width:0}
.col{display:flex;flex-direction:column;gap:12px}
h2{font-family:var(--display);font-size:18px;overflow-wrap:anywhere}
h3{font-family:var(--display);font-size:15px;margin-top:6px}
.ltr{direction:ltr;text-align:left}
[dir=rtl] input.ltr{text-align:right}

/* sign-in, profile and key screens */
#gate{flex:1 1 auto;display:flex;flex-direction:column;padding:28px 22px;background:var(--brand);color:#fff;overflow-y:auto}
.gwrap{margin:auto 0;display:flex;flex-direction:column;gap:16px;width:100%;max-width:460px;align-self:center}
#gate h1{font-family:var(--display);font-size:52px;line-height:1.1}
#gate p{color:rgba(255,255,255,.9)}
#gate label,.glbl{font-size:13px}
#gate input{width:100%;min-height:54px;padding:0 14px;border:0;border-radius:14px;background:#fff;color:var(--ink);font-size:16px}
#gate .note{font-size:13px;color:rgba(255,255,255,.85)}
#gate .gerr{background:#fff;color:var(--danger);border-radius:12px;padding:10px 12px;font-size:14px;font-weight:500}
#gate .btn.ghost{border-color:rgba(255,255,255,.5);color:#fff}
#gate input[type=checkbox]{width:24px;height:24px;min-height:24px;flex:none;padding:0;accent-color:var(--sun)}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.5}
.lnk{background:none;border:0;padding:0;color:inherit;font:inherit;font-weight:600;text-decoration:underline}
.terms{margin:0;padding-inline-start:20px;display:flex;flex-direction:column;gap:10px;font-size:14px;line-height:1.6}
.terms b{display:block}
.tbl{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{padding:8px 4px;text-align:start;border-bottom:1px solid rgba(128,128,128,.35)}
.tbl th{font-weight:600}
#gate .seg{background:rgba(255,255,255,.16)}
#gate .seg button{color:#fff}
#gate .seg button[aria-pressed="true"]{background:#fff;color:var(--brand-deep)}
.pwrow{display:flex;gap:8px}
.pwrow button{flex:none;min-width:64px;min-height:54px;border:1px solid rgba(255,255,255,.5);border-radius:14px;background:transparent;color:#fff;font-size:14px}
.gload{display:flex;align-items:center;gap:12px;font-size:16px}

/* app */
#app{flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
.top{flex:none;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 14px;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{font-family:var(--display);font-size:22px;font-weight:700;color:var(--brand)}
.chipbtn{min-height:44px;padding:0 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface);font-size:13px;font-weight:600}
.mapwrap{position:relative;flex:1 1 36%;min-height:220px}
#map{position:absolute;inset:0}
.hint{position:absolute;top:10px;inset-inline:10px;padding:8px 12px;border-radius:12px;background:var(--ink);color:#fff;font-size:13px;text-align:center}
.sheet{flex:0 1 auto;max-height:62%;overflow-y:auto;display:flex;flex-direction:column;gap:12px;padding:14px 14px calc(16px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--line);border-radius:22px 22px 0 0;margin-top:-16px;position:relative}
#app.full .mapwrap{display:none}
#app.full .sheet{flex:1 1 auto;max-height:none;margin-top:0;border-radius:0;border-top:0}
.seg{display:flex;gap:4px;padding:4px;border-radius:999px;background:var(--seg)}
.seg button{flex:1 1 0;min-height:44px;border:0;border-radius:999px;background:transparent;font-size:15px;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink);font-weight:600}
.field{display:flex;flex-direction:column;gap:4px;min-width:0;position:relative}
.field label,.lbl{font-size:12px;color:var(--muted)}
.inrow{display:flex;gap:8px}
.sheet input[type=text],.sheet input[type=time],.sheet input[type=date],.sheet input[type=number],.sheet select{width:100%;min-height:52px;padding:0 14px;border:1px solid var(--line);border-radius:14px;background:var(--surface);font-size:15px;font-weight:600}
.pinbtn{flex:none;width:52px;height:52px;border:1px solid var(--line);border-radius:14px;background:var(--surface);display:flex;align-items:center;justify-content:center;color:var(--brand)}
.pinbtn[aria-pressed="true"]{background:var(--sun);border-color:var(--sun);color:var(--sun-ink)}
.sug{list-style:none;margin:0;padding:4px;border:1px solid var(--line);border-radius:14px;background:var(--surface);display:flex;flex-direction:column;gap:2px}
.sug button{display:block;width:100%;min-height:44px;padding:8px 10px;border:0;border-radius:10px;background:none;text-align:start;font-size:14px}
.sug button:hover,.sug button:focus-visible{background:var(--seg)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.err{color:var(--danger);font-size:13px;font-weight:500}
.rcard{display:flex;flex-direction:column;gap:8px;width:100%;padding:14px;border:1px solid var(--line);border-radius:18px;background:var(--surface);text-align:start}
button.rcard[aria-pressed="true"],.rcard.on{border:2px solid var(--route);padding:13px}
.rcard .t{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.rcard .name{font-size:15px;font-weight:600;min-width:0;overflow-wrap:anywhere}
.rcard .dur{font-family:var(--display);font-size:26px;font-weight:700;color:var(--brand);flex:none;font-variant-numeric:tabular-nums}
.rcard .meta{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13px;color:var(--muted)}
.tag{display:inline-flex;align-items:center;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:600}
.tag.fast,.tag.ok{background:var(--brand-soft);color:var(--brand-deep)}
.tag.jam,.tag.wait{background:var(--sun-soft);color:var(--sun-soft-ink)}
.tag.no{background:var(--danger-soft);color:var(--danger)}
.banner{padding:10px 12px;border-radius:14px;background:var(--sun-soft);color:var(--sun-soft-ink);font-size:14px}
.okbox{padding:12px;border-radius:14px;background:var(--brand-soft);color:var(--brand-deep);font-size:14px}
.box{display:flex;flex-direction:column;gap:10px;padding:14px;border:1px solid var(--line);border-radius:18px}
.kv{display:flex;justify-content:space-between;gap:12px;font-size:14px}
.kv span:first-child{color:var(--muted)}
.kv b{font-weight:600;text-align:end;overflow-wrap:anywhere;min-width:0}
.big{font-family:var(--display);font-size:34px;font-weight:700;line-height:1;color:var(--brand);font-variant-numeric:tabular-nums}
.stepper{display:flex;align-items:center;justify-content:space-between;min-height:52px;padding:0 4px;border:1px solid var(--line);border-radius:14px}
.stepper button{width:44px;height:44px;border:0;border-radius:12px;background:var(--seg);font-size:20px;font-weight:600}
.stepper b{font-family:var(--display);font-size:18px}
.spin{width:22px;height:22px;border-radius:50%;border:3px solid rgba(255,255,255,.4);border-top-color:#fff;animation:rot 1s linear infinite;flex:none}
@keyframes rot{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:3s}}
.msgs{display:flex;flex-direction:column;gap:6px;max-height:210px;overflow-y:auto}
.msg{align-self:flex-start;max-width:85%;padding:6px 10px;border-radius:12px;background:var(--seg);font-size:14px;display:flex;flex-direction:column;overflow-wrap:anywhere}
.msg.me{align-self:flex-end;background:var(--brand-soft);color:var(--brand-deep)}
.msg small{font-size:11px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.days{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.days .chip{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px;line-height:1.25;min-height:52px;border-radius:14px}
.days .chip small{font-size:11px;color:var(--muted)}
.days .chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.days .chip[aria-pressed="true"] small{color:var(--brand-ink)}
.chip{min-height:44px;padding:0 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface);font-size:13px;font-weight:500}
.face{border-radius:50%;object-fit:cover;flex:none;background:var(--seg);color:var(--muted);display:inline-flex;align-items:center;justify-content:center;overflow:hidden}
#errbox{position:fixed;inset-inline:10px;bottom:10px;z-index:50;max-height:60%;overflow:auto;padding:14px;border-radius:16px;background:var(--danger-soft);color:var(--ink);border:2px solid var(--danger);display:flex;flex-direction:column;gap:8px}
#errbox h3{font-size:16px;color:var(--danger);margin:0}
#errbox pre{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px;direction:ltr;text-align:left;background:#fff;border-radius:10px;padding:8px}
</style>
</head>
<body>

<section id="gate"></section>

<section id="app" hidden>
  <div class="top">
    <span class="brand" id="brand"></span>
    <div class="row" style="gap:6px">
      <button class="chipbtn" type="button" id="b-lang"></button>
      <button class="chipbtn" type="button" id="b-acct"></button>
    </div>
  </div>
  <div class="mapwrap"><div id="map"></div><div class="hint" id="hint" hidden></div></div>
  <div class="sheet" id="sheet"></div>
</section>

<input type="file" id="selfie" accept="image/*" capture="user" hidden>
<div id="errbox" role="alert" hidden></div>

<script>
(function(){
'use strict';
/* Firebase web config. It identifies the project and is not a secret: access is decided by the database rules. */
var FB_CONFIG={apiKey:'AIzaSyDu_16hGFQWB8YO3G4u5Wtc8UIaZ_RP18U',authDomain:'khedni-df08b.firebaseapp.com',projectId:'khedni-df08b',storageBucket:'khedni-df08b.firebasestorage.app',messagingSenderId:'646263417160',appId:'1:646263417160:web:291d4f0723b5931894ab7d'};
var FB_BASE='https://www.gstatic.com/firebasejs/10.14.1/';

var LIMIT=800;    // within this the ride counts as passing right by the rider

var FEE=0.10;     // Khedni's share, taken from the driver's part
var RATES=[[10,.60],[20,.50],[50,.30],[1e9,0]]; // what a private car costs to run per km: first 10 km, next 10, then up to 50 km; past 50 km the share stops growing

var $=function(s){return document.querySelector(s)};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
function sget(k){try{return localStorage.getItem(k)}catch(e){return null}}
function sset(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function sdel(k){try{localStorage.removeItem(k)}catch(e){}}

/* keep the last console errors: Google writes the exact reason there, and a phone has no console to read */
var LOG=[];
['error','warn'].forEach(function(k){var o=console[k];console[k]=function(){try{LOG.push(Array.prototype.slice.call(arguments).map(String).join(' '));if(LOG.length>10)LOG.shift()}catch(e){}return o.apply(console,arguments)}});

/* ---------- state ---------- */
function blank(){return {text:'',lat:null,lng:null}}
var S={lang:sget('kh-lang')==='en'?'en':'ar',key:'',localKey:sget('kh-key')||'',
  gate:'boot',bootMsg:'',bootFail:false,keyErr:'',
  af:{mode:'in',name:'',phone:'',pw:'',drv:false,car:'',plate:'',show:false,terms:false,err:'',busy:false},agreed:null,termsFrom:'auth',
  user:null,me:null,admin:false,cfg:null,
  role:sget('kh-role')||'',view:'main',
  dv:'home',rideId:null,from:blank(),to:blank(),days:[],time:'07:30',busy:false,formErr:'',routes:null,sel:0,dep:null,confirmed:false,pt:null,seats:3,price:null,
  myRides:[],inReqs:[],pays:[],

  sug:{from:[],to:[],rfrom:[],rto:[]},pick:null,
  ad:null,adBusy:false,pay:{},applyErr:'',fresh:null,track:null,trackErr:'',live:null,rl:{},offer:null,offerFor:null,offerErr:'',chat:{},draft:{},chatOpen:null,hereMsg:null,locating:null,rr:null,repick:null,whDraft:null,ph:{},phBusy:false,phErr:''};
function T(ar,en){return S.lang==='en'?en:ar}

/* ---------- errors shown on screen, so a screenshot is enough to debug ---------- */
function showErr(title,detail,hint){
  var b=$('#errbox');
  b.innerHTML='<h3>'+esc(title)+'</h3>'+(hint?'<p>'+esc(hint)+'</p>':'')+(detail?'<pre>'+esc(detail)+'</pre>':'')+
    '<button class="btn sm ghost" type="button" id="errclose">'+T('سكّر','Close')+'</button>';
  b.hidden=false;
}
function explain(msg){
  msg=String(msg||'');
  if(/API key not valid|InvalidKey|API_KEY_INVALID/i.test(msg))return T('المفتاح مش صحيح. تأكد إنك نسخته كامل.','The key is not valid. Check that you copied all of it.');
  if(/has not been used|is disabled|SERVICE_DISABLED|not activated|ApiNotActivated/i.test(msg))return T('في خدمة مش مفعّلة بحساب جوجل. اسمها مكتوب بالرسالة تحت: فعّلها من صفحة جوجل.','A Google service is not enabled. Its name is in the message below: enable it in the Google console.');
  if(/RESOURCE_EXHAUSTED|quota|OVER_QUERY_LIMIT/i.test(msg))return T('وصلت للسقف اليومي اللي حطّيته. بيرجع يشتغل بكرا، أو ارفع السقف.','You reached the daily cap you set. It works again tomorrow, or raise the cap.');
  if(/billing|BillingNotEnabled/i.test(msg))return T('الفوترة مش مفعّلة عالمشروع.','Billing is not enabled on the project.');
  if(/referer|RefererNotAllowed|PERMISSION_DENIED|API_KEY_.*BLOCKED/i.test(msg))return T('المفتاح مقيّد وما بيسمح لهالصفحة أو لهالخدمة. راجع القيود بصفحة المفتاح.','The key is restricted and does not allow this page or this service. Review its restrictions on the key page.');
  if(/Failed to fetch|NetworkError|load failed/i.test(msg))return T('ما قدرنا نوصل لجوجل. تأكد من الإنترنت وجرّب مرة تانية.','Could not reach Google. Check your connection and try again.');
  return '';
}
window.addEventListener('error',function(e){showErr(T('صار خطأ بالصفحة','Something went wrong on the page'),(e.message||'')+(e.filename?'\n'+e.filename+':'+e.lineno:''),'')});
window.addEventListener('unhandledrejection',function(e){var m=(e.reason&&(e.reason.message||e.reason))||'';showErr(T('صار خطأ','Something went wrong'),String(m),explain(m))});
function mapErrHint(m){
  if(m==='ApiNotActivatedMapError')return T('خدمة Maps JavaScript API مش مفعّلة بالمشروع. فعّلها، نطور دقيقتين، وافتح الصفحة من جديد.','The Maps JavaScript API is not enabled on the project. Enable it, wait two minutes, and reopen this page.');
  if(m==='InvalidKeyMapError')return T('مفتاح الخرائط مش صحيح أو مش كامل. غيّره من "حسابي".','The maps key is wrong or incomplete. Change it under "Account".');
  if(m==='BillingNotEnabledMapError')return T('الفوترة مش مربوطة بهالمشروع.','Billing is not linked to this project.');
  if(m==='RefererNotAllowedMapError')return T('مفتاح الخرائط مقيّد على مواقع محدّدة وهالصفحة مش منها. ضيف عنوان هالصفحة بقيود المفتاح.','The maps key is restricted to specific websites and this page is not one of them. Add this page’s address to the key restrictions.');
  if(m==='ApiTargetBlockedMapError')return T('المفتاح مقيّد وما بيسمح بـMaps JavaScript API. ضيفها بـAPI restrictions.','The key is restricted and does not allow the Maps JavaScript API. Add it under API restrictions.');
  if(m==='ExpiredKeyMapError')return T('المفتاح منتهي أو لسا جديد. نطور 5 دقايق وجرّب.','The key has expired or is too new. Wait 5 minutes and try again.');
  return T('المفتاح غلط، أو الفوترة مش مفعّلة، أو خدمة Maps JavaScript API مش مفعّلة. السبب بالضبط مكتوب تحت إذا جوجل عطته.','The key is wrong, billing is off, or the Maps JavaScript API is not enabled. The exact reason is below if Google gave one.')}
window.gm_authFailure=function(){setTimeout(function(){var log=LOG.join('\n'),m=(log.match(/(\w+MapError)/)||[])[1]||'';showErr(T('جوجل رفضت مفتاح الخرائط','Google rejected the maps key')+(m?' · '+m:''),log||'gm_authFailure',mapErrHint(m))},500)};
function authErr(e){var c=String(e&&e.code||''),m=String(e&&e.message||e);
  if(/email-already-in-use/.test(c))return T('هالرقم عنده حساب من قبل. اكبس "دخول" وحط كلمة السر.','This number already has an account. Tap "Sign in" and enter the password.');
  if(/invalid-credential|wrong-password|user-not-found|invalid-login/.test(c))return T('الرقم أو كلمة السر غلط. إذا ما عندك حساب، اكبس "حساب جديد".','Wrong number or password. If you have no account, tap "New account".');
  if(/weak-password/.test(c))return T('كلمة السر لازم تكون 6 أحرف أو أكتر.','The password must be 6 characters or more.');

  if(/operation-not-allowed/.test(c))return T('الدخول بكلمة سر مش مفعّل بـFirebase (Authentication ← Email/Password).','Password sign-in is not enabled in Firebase (Authentication → Email/Password).');
  if(/unauthorized-domain/.test(c))return T('عنوان هالصفحة مش مسموح بـFirebase. ضيفه بـAuthentication ← Settings ← Authorized domains.','This page’s address is not allowed in Firebase. Add it under Authentication → Settings → Authorized domains.');
  if(/api-key/.test(c))return T('كود الربط بـFirebase مش صحيح.','The Firebase config is not valid.');
  if(/permission-denied/.test(c+m))return T('قاعدة البيانات رفضت تحفظ الحساب. قواعد الحماية (Rules) بعد ما انحطّت بـFirebase.','The database refused to save the account. The security rules are not set in Firebase yet.');
  return T('ما مشي الحال: ','That did not work: ')+(c||m)}

  return n===0||n===1?dayName(n):n===-1?T('مبارح','Yesterday'):wd(d)+' '+d.getDate()+'/'+(d.getMonth()+1)}

function setTime(v,redraw){S.time=v;if(S.routes)S.dep=depDate();if(S.formErr&&depDate()>=new Date())S.formErr='';if(redraw)render()}

// Lebanese numbers in any spelling (03 123 456, +961 70 123 456, 0096170123456) become 961XXXXXXXX
function normPhone(s){var d=digits(s).replace(/\D/g,'');
  if(d.indexOf('00961')===0)d=d.slice(5);else if(d.indexOf('961')===0&&d.length>8)d=d.slice(3);
  if(d.charAt(0)==='0')d=d.slice(1);

function showPhone(p){p=String(p||'');return p.indexOf('961')===0?'+961 '+p.slice(3):p}
function decode(str){var i=0,lat=0,lng=0,out=[],b,shift,res;
  while(i<str.length){shift=0;res=0;do{b=str.charCodeAt(i++)-63;res|=(b&31)<<shift;shift+=5}while(b>=32);lat+=(res&1)?~(res>>1):(res>>1);
    shift=0;res=0;do{b=str.charCodeAt(i++)-63;res|=(b&31)<<shift;shift+=5}while(b>=32);lng+=(res&1)?~(res>>1):(res>>1);
    out.push({lat:lat/1e5,lng:lng/1e5})}

function hav(a,b){var R=6371000,x=(b.lat-a.lat)*Math.PI/180,y=(b.lng-a.lng)*Math.PI/180,s=Math.sin(x/2)*Math.sin(x/2)+Math.cos(a.lat*Math.PI/180)*Math.cos(b.lat*Math.PI/180)*Math.sin(y/2)*Math.sin(y/2);return 2*R*Math.asin(Math.sqrt(s))}

function at(R,c){var i=1;while(i<R.cum.length-1&&R.cum[i]<c)i++;var seg=(R.cum[i]-R.cum[i-1])||1,t=(c-R.cum[i-1])/seg,a=R.path[i-1],b=R.path[i];return {lat:a.lat+(b.lat-a.lat)*t,lng:a.lng+(b.lng-a.lng)*t}}

// one rider and the driver split the cost of the trip, so a rider's share is at most half of it
function capPrice(m){return Math.max(MINS,Math.round(tripCost(m)/2*2)/2)}
// a rider who joins for part of the road shares what that distance is worth, lowered by the same proportion the driver lowered the full ride
function segPrice(R,seg){var road=R.dist||total(R),ratio=Math.min(1,R.price/capPrice(road));return Math.max(Math.min(MINS,R.price),Math.round(capPrice(seg/total(R)*road)*ratio*2)/2)}

  unwatchLive();unwatchRL();unwatchChat();unwatchRide();S.chatOpen=null;S.draft={};S.agreed=null;S.offer=null;S.ph={};PHW={};S.track=null;S.trackErr='';S.user=u;S.me=null;S.admin=false;S.cfg=null;S.myRides=[];S.inReqs=[];S.myReqs=[];S.pays=[];S.ad=null;

function enter(){
  var uid=S.user.uid,f=F.f;
  photo(uid);checkConsent();
  if(S.role!=='driver'&&S.role!=='rider')S.role=S.me.dstatus&&S.me.dstatus!=='none'?'driver':'rider';
  f.getDoc(ref('adminping','x')).then(function(){S.admin=true;paint()}).catch(function(){S.admin=false});
  listen(f.query(col('rides'),f.where('driverId','==',uid)),function(s){S.myRides=rows(s).map(hyd);got.rides=true;upkeep();paint()},T('المشاوير','rides'));
  listen(f.query(col('requests'),f.where('driverId','==',uid)),function(s){S.inReqs=rows(s);got.reqs=true;upkeep();if(S.track&&S.track.col==='live'&&S.track.pos)sendLive(true);paint()},T('الطلبات','requests'));
  listen(f.query(col('requests'),f.where('riderId','==',uid)),function(s){S.myReqs=rows(s);paint()},T('حجوزاتي','bookings'));
  listen(f.query(col('payments'),f.where('driverId','==',uid)),function(s){S.pays=rows(s);paint()},T('الدفعات','payments'));

// the driver's own phone keeps each ride tidy: free seats match the accepted riders, and finished rides are closed
var upTimer=0;
function upkeep(){clearTimeout(upTimer);upTimer=setTimeout(function(){
  if(!got.rides||!got.reqs||!S.user)return;var now=Date.now();
  S.myRides.forEach(function(R){
    if(R.status!=='open'||tidied[R.id])return;
    var acc=S.inReqs.filter(function(q){return q.rideId===R.id&&(q.status==='accepted'||q.status==='offered')}).length,want=Math.max(0,R.seats-acc),
      fix=R.dep+R.dur*1000<now-2*3600000?{status:'done'}:R.seatsLeft!==want?{seatsLeft:want}:null;
    if(!fix)return;
    tidied[R.id]=1;F.f.updateDoc(ref('rides',R.id),fix).catch(function(){}).then(function(){delete tidied[R.id]});
  })},900)}
function myRide(id){for(var i=0;i<S.myRides.length;i++)if(S.myRides[i].id===id)return S.myRides[i];return null}

/* ---------- Google: load, map, places, routes ---------- */
var map=null,ov=[],places=null,token=null,mapState='none';
function ensureMap(){
  if(S.agreed!==true){if(S.agreed===false&&S.gate!=='agree'){S.gate='agree';showGate()}return}
  if(mapState==='ready'){if(S.gate){hideGate();initMap();paint()}return}

  mapState='loading';S.key=key;S.gate='boot';S.bootMsg=T('عم نحمّل الخريطة…','Loading the map…');showGate();
  loadMaps(key).then(function(){mapState='ready';if(!S.user||!S.me)return;hideGate();initMap();paint();if(S.role==='rider'&&S.rfrom.lat==null&&!hereAsked.rfrom)useHere('rfrom',true)})
   .catch(function(){mapState='none';S.keyErr=T('ما قدرنا نحمّل خرائط جوجل. تأكد من الإنترنت وجرّب مرة تانية.','Could not load Google Maps. Check your connection and try again.');S.gate='key';showGate()});

  if(R&&R.id===q.rideId&&R.path.length>1){var c=nearestOnPath(R,pos),p=nearestOnPath(R,q.pu);
    if(c.d<1500){o.left=p.cum-c.cum;if(o.left>0)o.eta=new Date(Date.now()+o.left/total(R)*R.dur*1000)}}
  return o}

var TERMS=[
 ['شو هي خدني','خدني منصّة بتعرّف صاحب سيارة نازل عطريقه على شريك رايح بنفس الاتجاه. خدني مش شركة نقل ولا تاكسي: ما بتملك سيارات، ما بتوظّف أصحاب سيارات، وما بتحدّد الطريق ولا الوقت.',
  'What Khedni is','Khedni is a platform that introduces a car owner already making a trip to a road partner going the same way. Khedni is not a transport or taxi company: it owns no cars, employs no car owners, and sets neither the route nor the time.'],
 ['المشوار اتفاق بينكم','كل مشوار هو اتفاق مباشر بين صاحب السيارة وشريك الطريق، وبيصير على مسؤوليتهم. الطرفين أحرار يقبلوا أو يرفضوا أي طلب.',
  'The ride is between you','Every ride is a direct agreement between the car owner and the road partner, made at their own responsibility. Either may accept or decline any request.'],
 ['تقاسم كلفة، مش أجرة','المبلغ اللي بيدفعه شريك الطريق هو مشاركة بكلفة المشوار (بنزين، صيانة، واستهلاك سيارة)، مش أجرة نقل. خدني بتحسبه سلفاً حسب المسافة وبتبيّنه للطرفين قبل المشوار، ليعرف كل واحد قدّيش بيشارك: لا أكتر ولا أقل. الكلفة بتتقسّم على كل اللي بالسيارة، فكل ما زاد عدد شركاء الطريق بتنقص مشاركة كل واحد. صاحب السيارة فيه ينقّص المبلغ وما فيه يزيده. ممنوع استعمال خدني للشغل كتاكسي أو للربح من نقل شركاء الطريق.',
  'Cost sharing, not a fare','What the road partner pays is a share of the trip’s cost (fuel, maintenance and wear), not a transport fare. Khedni works it out in advance from the distance and shows it to both sides before the trip, so each knows what they share: no more and no less. The cost is split between everyone in the car, so each share falls as more road partners join. The car owner may lower the amount but not raise it. Using Khedni to work as a taxi or to profit from carrying people is not allowed.'],
 ['تعهّد صاحب السيارة','صاحب السيارة بيأكّد إنو معه دفتر سواقة صالح، وإنو السيارة مسجّلة وميكانيكها ماشي وعليها تأمين ساري بيغطّي شركاء الطريق، وإنو بيلتزم بقانون السير وما بيسوق تعبان أو تحت تأثير كحول أو مخدّرات.',
  'The car owner’s undertaking','The car owner confirms that they hold a valid driving licence, that the car is registered, roadworthy and covered by valid insurance that includes people, and that they follow traffic law and never drive tired or under the influence of alcohol or drugs.'],
 ['التأمين','تأمين السيارة وشركاء الطريق على مسؤولية صاحب السيارة وحده. خدني ما بتقدّم أي تأمين. شريك الطريق بيطلع وهو عارف هالشي.',
  'Insurance','Insuring the car and its people is the car owner’s responsibility alone. Khedni provides no insurance. The road partner travels knowing this.'],
 ['الحوادث والأضرار','ضمن اللي بيسمح فيه القانون، خدني مش مسؤولة عن أي حادث، إصابة، ضرر، سرقة، تأخير، إلغاء، أو تصرّف من أي مستخدم قبل المشوار أو خلاله أو بعده. المسؤولية على صاحب السيارة وشريك الطريق.',
  'Accidents and damage','To the extent the law allows, Khedni is not responsible for any accident, injury, damage, theft, delay, cancellation or conduct of any user before, during or after a ride. Responsibility lies with the car owner and the road partner.'],
 ['السلوك','الاحترام واجب. ممنوع التحرّش، العنف، التهديد، التمييز، أو طلب مصاري زيادة عن المتّفق عليه. الإدارة بتقدر توقّف أي حساب بيخالف، وبتبلّغ السلطات إذا لزم.',
  'Conduct','Respect is required. Harassment, violence, threats, discrimination or asking for more money than agreed are forbidden. The admin may suspend any account that breaks this and may report to the authorities.'],
 ['العمر والمعلومات الصحيحة','لازم يكون عمرك 18 سنة أو أكتر، والاسم والرقم والصورة وأوراق السيارة اللي بتحطّهم يكونوا إلك وصحيحين.',
  'Age and true information','You must be 18 or older, and the name, number, photo and car details you give must be your own and true.'],
 ['رسم خدني','خدني بتاخد 10% من حصة صاحب السيارة عن كل شريك مأكّد. شريك الطريق ما بيدفع رسم لخدني. بهالنسخة التجريبية الدفع كاش بين شريك الطريق وصاحب السيارة.',
  'Khedni’s fee','Khedni takes 10% of the car owner’s share for each confirmed road partner. The road partner pays Khedni nothing. In this trial version payment is in cash between road partner and car owner.'],
 ['معلوماتك','منحفظ اسمك، رقمك، صورتك، سيارتك ومشاويرك. رقمك بتشوفه الإدارة بس. صورتك واسمك بيشوفهم اللي طالع معك. موقعك بينبعت بس لما إنت تكبس "شارك موقعي"، وبس للطرف التاني بالمشوار. ممكن نسلّم معلومات للسلطات إذا القانون طلب.',
  'Your information','We store your name, number, photo, car and rides. Only the admin sees your number. The person you ride with sees your photo and name. Your location is sent only when you tap “share my location”, and only to the other party of that ride. We may hand information to the authorities when the law requires.'],
 ['الأوقات تقريبية','أوقات الوصول والعجقة جايين من خرائط جوجل وهنّي تقديرات، مش ضمانة.',
  'Times are estimates','Arrival and traffic times come from Google Maps and are estimates, not guarantees.'],
 ['نسخة تجريبية','هيدي نسخة تجريبية. الشروط ممكن تتغيّر، وساعتها منطلب موافقتك من جديد. القانون اللبناني هو المطبّق.',
  'Trial version','This is a trial version. The terms may change, and we will then ask for your agreement again. Lebanese law applies.']
];
function termsHTML(){return '<ol class="terms">'+TERMS.map(function(t){return '<li><b>'+T(t[0],t[2])+'</b>'+T(t[1],t[3])+'</li>'}).join('')+'</ol><p class="sub" style="color:inherit;opacity:.8">'+T('مسودة تجريبية · النسخة ','Trial draft · version ')+TERMS_V+'</p>'}

var AG={};
function agreeLocal(uid){AG[uid]=1;sset('kh-terms-'+uid,String(TERMS_V))}
function agreeRemote(uid){F.f.setDoc(ref('consents',uid),{v:TERMS_V,at:Date.now()}).catch(function(){})}
function hasAgreed(uid){return !!AG[uid]||sget('kh-terms-'+uid)===String(TERMS_V)}
function checkConsent(){var uid=S.user.uid,local=hasAgreed(uid);S.agreed=local?true:null;
  F.f.getDoc(ref('consents',uid)).then(function(x){var ok=x.exists()&&x.data().v===TERMS_V;if(ok)agreeLocal(uid);else if(local)agreeRemote(uid);return ok}).catch(function(){return false})
   .then(function(ok){if(!S.user||S.user.uid!==uid||local)return;S.agreed=ok;if(S.cfg)ensureMap()})}
function chkTerms(){return '<label class="chk"><input type="checkbox" id="af-terms"'+(S.af.terms?' checked':'')+'><span>'+T('قرأت ','I have read the ')+'<button type="button" class="lnk" id="seeterms">'+T('شروط الاستخدام','terms of use')+'</button>'+T(' ووافقت عليها، وعمري 18 سنة أو أكتر.',' and agree to them, and I am 18 or older.')+'</span></label>'}
function gin(k,label,type,val,ph,ac,ltr){return '<div class="col" style="gap:4px"><label for="af-'+k+'">'+label+'</label><input id="af-'+k+'" data-af="'+k+'" type="'+type+'" value="'+esc(val)+'" placeholder="'+esc(ph)+'" autocomplete="'+ac+'"'+(ltr?' class="ltr"':'')+(type==='tel'?' inputmode="tel"':'')+'></div>'}

    '<p class="note">'+T('حساب صاحب السيارة بيتفعّل بعد ما الإدارة توافق عليه. لبين ما توافق، فيك تطلع كشريك طريق.','A car owner account starts working once the admin approves it. Until then you can still ride as a road partner.')+'</p>':'')}

    '<button class="btn sun" type="button" id="agree">'+T('قرأت ووافقت، وعمري 18 أو أكتر','I have read and agree, and I am 18 or older')+'</button>'+foot+'</div>';

    '<div class="gload" role="status">'+(S.bootFail?'':'<span class="spin" aria-hidden="true"></span>')+'<span>'+esc(S.bootMsg)+'</span></div>'+(S.bootFail||S.user?foot:'')+'</div>';
  if(S.gate==='key')return '<div class="gwrap">'+head(T('الخريطة بدها مفتاح جوجل.','The map needs a Google key.'))+
    '<form id="keyform" class="col" novalidate><div class="col" style="gap:4px"><label for="key">'+T('الصق مفتاح خرائط جوجل هون','Paste the Google Maps key here')+'</label><input type="text" id="key" class="ltr" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="AIza..."></div>'+
    (S.keyErr?'<div class="gerr" role="alert">'+esc(S.keyErr)+'</div>':'')+'<button class="btn sun" type="submit">'+T('افتح الخريطة','Open the map')+'</button></form>'+
    '<p class="note">'+T('إذا إنت مش صاحب التطبيق: الإدارة بعد ما فعّلت الخريطة. جرّب بعد شوي.','If you are not the app owner: the admin has not switched the map on yet. Try again later.')+'</p>'+foot+'</div>';
  if(S.gate==='profile')return '<div class="gwrap">'+head(T('بقي خطوة: كمّل حسابك.','One step left: finish your account.'))+
    '<form id="profform" class="col" novalidate>'+gin('name',T('الاسم','Name'),'text',a.name,T('مثلاً: كريم حداد','e.g. Karim Haddad'),'name')+drvPart()+chkTerms()+err+
    '<button class="btn sun" type="submit"'+(a.busy?' disabled':'')+'>'+T('كمّل','Continue')+'</button></form>'+foot+'</div>';
  var up=a.mode==='up';
  return '<div class="gwrap">'+head(T('شارك مشوارك وكلفته مع حدا نازل عطريقك. مش تاكسي.','Share your trip and its cost with someone going your way. Not a taxi.'))+
    inappHTML()+'<p class="note">'+T('المبلغ مشاركة بكلفة المشوار بس، محسوب سلفاً: لا أكتر ولا أقل. ','The amount is only a share of the trip’s cost, worked out in advance: no more and no less. ')+'<button type="button" class="lnk" id="seeshare">'+T('كيف منحسبها؟','How is it worked out?')+'</button></p>'+
    '<div class="seg" role="group"><button type="button" data-amode="in" aria-pressed="'+(!up)+'">'+T('دخول','Sign in')+'</button><button type="button" data-amode="up" aria-pressed="'+up+'">'+T('حساب جديد','New account')+'</button></div>'+
    '<form id="authform" class="col" novalidate>'+
    (up?gin('name',T('الاسم','Name'),'text',a.name,T('مثلاً: كريم حداد','e.g. Karim Haddad'),'name'):'')+
    gin('phone',T('رقم التلفون','Phone number'),'tel',a.phone,'70 123 456','tel',true)+
    '<div class="col" style="gap:4px"><label for="af-pw">'+(up?T('كلمة سر (6 أحرف أو أكتر)','Password (6 characters or more)'):T('كلمة السر','Password'))+'</label><div class="pwrow"><input id="af-pw" data-af="pw" class="ltr" type="'+(a.show?'text':'password')+'" value="'+esc(a.pw)+'" autocomplete="'+(up?'new-password':'current-password')+'"><button type="button" id="af-show" aria-pressed="'+a.show+'">'+(a.show?T('خبّي','Hide'):T('بيّن','Show'))+'</button></div></div>'+
    (up?drvPart()+chkTerms():'')+err+
    '<button class="btn sun" type="submit"'+(a.busy?' disabled':'')+'>'+(a.busy?T('لحظة…','One moment…'):up?T('اعمل الحساب','Create the account'):T('ادخل','Sign in'))+'</button></form>'+
    '<p class="note">'+(up?T('رقمك ما بيبيّن لا لصاحب السيارة ولا لشريك الطريق. بتشوفه الإدارة بس.','Your number is not shown to car owners or road partners. Only the admin sees it.'):T('نسيت كلمة السر؟ احكي مع الإدارة.','Forgot your password? Contact the admin.'))+'</p>'+foot+'</div>';
}
function showGate(){
  document.documentElement.lang=S.lang;document.documentElement.dir=T('rtl','ltr');
  var act=document.activeElement&&document.activeElement.id,g=$('#gate');
  $('#app').hidden=true;g.hidden=false;g.innerHTML=gateHTML();
  if(act&&/^af-/.test(act)){var el=document.getElementById(act);if(el&&el.tagName==='INPUT'){el.focus();try{el.setSelectionRange(el.value.length,el.value.length)}catch(e){}}}
}
function hideGate(){S.gate=null;var g=$('#gate');g.hidden=true;g.innerHTML='';$('#app').hidden=false}
function profileData(ph){var a=S.af;return {name:a.name.trim(),phone:ph,car:a.drv?a.car.trim():'',plate:a.drv?a.plate.trim():'',dstatus:a.drv?'pending':'none',createdAt:Date.now()}}
function checkProfile(){var a=S.af;
  if(a.name.trim().length<2)return T('اكتب اسمك.','Enter your name.');
  if(a.drv&&a.car.trim().length<2)return T('اكتب نوع السيارة.','Enter the car model.');
  if(a.drv&&a.plate.trim().length<2)return T('اكتب رقم اللوحة.','Enter the plate number.');
  if(!a.terms)return T('لازم توافق على شروط الاستخدام لتكمّل. حط علامة الصح تحت.','You need to agree to the terms of use to continue. Tick the box below.');
  return ''}
function doAuth(){var a=S.af,up=a.mode==='up',ph=normPhone(a.phone);
  a.err=!ph?T('رقم التلفون مش مظبوط. اكتبه متل: 70 123 456 أو 03 123 456.','That phone number does not look right. Write it like 70 123 456 or 03 123 456.'):a.pw.length<6?T('كلمة السر لازم تكون 6 أحرف أو أكتر.','The password must be 6 characters or more.'):up?checkProfile():'';
  if(a.err){showGate();return}
  a.busy=true;showGate();
  var p;
  if(up){creating=true;if(a.drv)S.role='driver';
    p=F.a.createUserWithEmailAndPassword(auth,ph+MAIL,a.pw).then(function(c){agreeLocal(c.user.uid);return F.f.setDoc(ref('users',c.user.uid),profileData(ph)).then(function(){agreeRemote(c.user.uid)})}).then(function(){creating=false})}
  else p=F.a.signInWithEmailAndPassword(auth,ph+MAIL,a.pw);
  p.then(function(){a.busy=false;a.pw='';a.err=''})
   .catch(function(e){var was=creating;creating=false;a.busy=false;a.err=authErr(e);
     if(was&&auth.currentUser){S.gate='profile'} // the sign-in exists but its profile was not saved: let them finish it
     if(S.gate)showGate()});
}
function doProfile(){var a=S.af;a.err=checkProfile();if(a.err){showGate();return}
  var ph=String(S.user.email||'').split('@')[0];a.busy=true;showGate();if(a.drv)S.role='driver';
  var me=S.user.uid;agreeLocal(me);
  F.f.setDoc(ref('users',me),profileData(ph)).then(function(){a.busy=false;a.err='';agreeRemote(me)})

function nameIt(which,slot,placeId){var poi=null,geo=null,left=2;
  var done=function(){if(--left)return;if(S[which]!==slot)return;
    var area=geo&&geo.area,name=poi?(area&&poi.indexOf(area)<0?poi+'، '+area:poi):geo&&geo.text;
    if(name){slot.text=name;slot.named=true;render()}};
  var P=places&&places.Place;
  if(!P){left--}else{try{
    (placeId?new P({id:placeId}).fetchFields({fields:['displayName']}).then(function(r){return (r&&r.place||{}).displayName}):
      // the place people know is the one the map itself labels: among places within ~70 m take the most reviewed one
      // (a mall rather than a shop inside it, a restaurant rather than an office upstairs); little-known spots fall back to the street
      P.searchNearby({fields:['displayName','location','userRatingCount'],locationRestriction:{center:{lat:slot.lat,lng:slot.lng},radius:70},maxResultCount:10,
        rankPreference:places.SearchNearbyRankPreference?places.SearchNearbyRankPreference.POPULARITY:'POPULARITY',language:S.lang,region:'LB'})
       .then(function(r){var best=null,bn=-1;((r&&r.places)||[]).forEach(function(pl){if(!pl.location)return;var d=hav({lat:pl.location.lat(),lng:pl.location.lng()},slot),n=pl.userRatingCount||0;
          if(d<=80&&n>=MINREV&&n>bn){best=pl;bn=n}});return best?best.displayName:null}))
     .then(function(n){poi=n?String(n):null;done()},function(){done()})}catch(e){left--}}
  if(geoOff||!window.google||!google.maps.Geocoder){done();return}
  try{new google.maps.Geocoder().geocode({location:{lat:slot.lat,lng:slot.lng},language:S.lang,region:'LB'},function(res,st){
    if(st!=='OK'||!res||!res.length){if(st==='REQUEST_DENIED')geoOff=true;done();return}
    var pick=function(types){for(var i=0;i<res.length;i++){var cs=res[i].address_components||[];for(var j=0;j<cs.length;j++)for(var k=0;k<types.length;k++)if(cs[j].types.indexOf(types[k])>=0)return cs[j].long_name}return ''};
    var ok=function(x){return x&&!/^unnamed|^Unnamed|بدون اسم/.test(x)};
    var street=pick(['route']),area=pick(['neighborhood','sublocality_level_1','sublocality','locality','administrative_area_level_3','administrative_area_level_2']);
    geo={area:ok(area)?area:'',text:[street,area].filter(function(x,i,a){return ok(x)&&a.indexOf(x)===i}).join('، ')||String(res[0].formatted_address||'').replace(/,?\s*(Lebanon|لبنان)\s*$/,'')};done()})}catch(e){done()}}

        if(map){map.panTo({lat:c.latitude,lng:c.longitude});if(map.setZoom)map.setZoom(15)}}

document.addEventListener('change',function(e){if(e.target.id==='in-price'){if(S.price!=null)e.target.value=S.price;render();return}if(e.target.id==='af-terms'){S.af.terms=e.target.checked;return}if(e.target.id==='selfie'){savePhoto(e.target.files&&e.target.files[0]);return}if(e.target.id==='in-rdate')S.rdate=e.target.value;if((e.target.id==='in-time'||e.target.id==='in-time2')&&e.target.value)setTime(e.target.value,true)});
document.addEventListener('click',function(e){var t=e.target.closest('button');if(!t)return;var d=t.dataset,f=F&&F.f,q,R;
  if(t.id==='errclose'){$('#errbox').hidden=true;return}
  if(t.id==='g-lang'||t.id==='b-lang'){switchLang();return}
  if(!F)return;
  /* before the app */
  if(d.amode){S.af.mode=d.amode;S.af.err='';showGate();return}
  if(d.drv){S.af.drv=d.drv==='1';showGate();return}
  if(t.id==='af-show'){S.af.show=!S.af.show;showGate();return}
  if(t.id==='seeshare'){S.termsFrom=S.gate;S.gate='share';showGate();$('#gate').scrollTop=0;return}
  if(t.id==='seeterms'){S.termsFrom=S.gate;S.gate='terms';showGate();$('#gate').scrollTop=0;return}
  if(t.id==='termsback'){S.gate=S.termsFrom||'auth';showGate();return}
  if(t.id==='agree'){if(!S.user)return;agreeLocal(S.user.uid);agreeRemote(S.user.uid);S.agreed=true;if(S.cfg)ensureMap();else{S.gate='boot';showGate()}return}
  if(t.id==='g-out'||t.id==='signout'){signOut();return}
  if(S.gate||!S.me)return;
  /* shared */
  if(t.id==='b-acct'){S.view=S.view==='main'?'account':S.view==='account'?'main':'account';S.pick=null;paint();return}
  if(d.sug){chooseSug(d.sug,+d.i);return}
  if(d.pick){S.pick=S.pick===d.pick?null:d.pick;S.offer=null;render();return}
  if(d.here){useHere(d.here,false);return}
  if(d.role){S.role=d.role;sset('kh-role',S.role);S.pick=null;S.pt=null;paint();if(S.role==='rider'&&S.rfrom.lat==null&&!hereAsked.rfrom)useHere('rfrom',true);return}
  /* driver */
  if(d.dday){var k=S.days.indexOf(d.dday);if(k>=0)S.days.splice(k,1);else S.days.push(d.dday);S.days.sort();render();return}
  if(d.seat){S.seats=Math.max(1,Math.min(6,S.seats+(+d.seat)));render();return}
  if(d.route&&!S.confirmed){S.sel=+d.route;S.pt=null;paint();return}
  if(d.ride){S.dv='ride';S.rideId=d.ride;S.pt=null;paint();R=myRide(d.ride);if(R)fit([R.path]);return}
  if(d.acc){q=inReq(d.acc);S.offer=null;if(q)setReq(q,'accepted','driver');return}
  if(d.offer){S.pick=S.pick==='offer'&&S.offerFor===d.offer?null:'offer';S.offerFor=d.offer;S.offer=null;S.offerErr='';paint();R=myRide(S.rideId);if(R&&S.pick)fit([R.path]);return}
  if(t.id==='offerx'){S.offer=null;paint();return}
  if(t.id==='offersend'){q=inReq(S.offer&&S.offer.id);R=q&&myRide(q.rideId);if(!q||!R)return;var o=S.offer,bb=f.writeBatch(db);
    bb.update(ref('requests',q.id),{status:'offered',by:'driver',updatedAt:Date.now(),pu:o.pos,puAt:o.at,puText:T('نقطة حدّدها صاحب السيارة عطريقه','Point set by the car owner on their route'),price:o.price,fee:r2(o.price*FEE),km:o.km});
    bb.update(ref('rides',R.id),{seatsLeft:Math.max(0,R.seatsLeft-1)});S.offer=null;
    bb.commit().catch(fail(T('الاقتراح','proposal')));paint();return}
  if(d.rok){q=myReq(d.rok);if(q)f.updateDoc(ref('requests',q.id),{status:'accepted',by:'rider',updatedAt:Date.now()}).catch(fail(T('التأكيد','confirmation')));return}
  if(t.id==='addphoto'){var inp=$('#selfie');inp.value='';inp.click();return}
  if(d.rej){q=inReq(d.rej);if(q)setReq(q,'rejected','driver');return}
  if(d.chat){S.chatOpen=S.chatOpen===d.chat?null:d.chat;render();return}
  if(d.quick){var qk=QUICK[d.role2][+d.i];if(qk)sendMsg(d.quick,T(qk[0],qk[1]));return}
  if(d.send){sendMsg(d.send,S.draft[d.send]);return}
  if(d.rroute&&S.rr){S.rr.sel=+d.rroute;paint();return}
  if(d.repick){S.pick=S.pick==='repick'?null:'repick';S.rrErr='';paint();if(S.reqRide)fit([S.reqRide.path]);return}
  if(d.reask){q=myReq(d.reask);var rmx=q&&reMatch(q);if(!rmx||!rmx.ok)return;
    f.updateDoc(ref('requests',q.id),{status:'pending',by:'rider',updatedAt:Date.now(),pu:rmx.a.pos,puAt:rmx.at.getTime(),puText:T('نقطة عالطريق الجديد','Point on the new route'),dr:rmx.b.pos,drAt:rmx.drAt.getTime(),price:rmx.price,fee:r2(rmx.price*FEE),km:rmx.km})
     .then(function(){S.repick=null;paint()}).catch(fail(T('الطلب','request')));return}
  if(d.track){startTrack('live',d.track);return}
  if(d.rtrack){q=myReq(d.rtrack);if(q)startTrack('rlive',q.id,q.driverId);return}
  if(t.id==='untrack'){stopTrack();return}
  if(d.drop){q=inReq(d.drop);if(q)setReq(q,'cancelled','driver');return}
  /* rider */
  if(d.found){S.fsel=+d.found;paint();fit([S.found.ok[S.fsel].R.path]);return}
  if(d.req){openReq(d.req);return}
  if(d.rcancel){q=myReq(d.rcancel);if(q){if(S.track&&S.track.docId===q.id)stopTrack();setReq(q,'cancelled','rider')}return}
  /* admin */
  if(d.ust){f.updateDoc(ref('users',d.u),{dstatus:d.ust}).then(loadAdmin).catch(fail(T('الحساب','account')));return}
  if(d.paid){var amt=r2(parseFloat(digits(S.pay[d.paid])));if(!(amt>0))return;
    f.addDoc(col('payments'),{driverId:d.paid,amount:amt,at:Date.now(),by:S.user.uid}).then(function(){S.pay[d.paid]='';loadAdmin()}).catch(fail(T('الدفعة','payment')));return}
  switch(t.id){
   case 'apply':
    if(S.af.car.trim().length<2||S.af.plate.trim().length<2){S.applyErr=T('اكتب نوع السيارة ورقم اللوحة.','Enter the car model and the plate number.');render();return}
    S.applyErr='';f.updateDoc(ref('users',S.user.uid),{car:S.af.car.trim(),plate:S.af.plate.trim(),dstatus:'pending'}).catch(fail(T('الطلب','request')));return;
   case 'newride':S.dv='new';resetNew();S.days=[ymdIn(1)];paint();useHere('from',true);return;
   case 'again':R=myRide(S.rideId);if(!R||R.path.length<2)return;S.dv='new';resetNew();var e0=R.path[0],e1=R.path[R.path.length-1],dd=new Date(R.dep);
    S.from={text:R.fromText,lat:e0.lat,lng:e0.lng};S.to={text:R.toText,lat:e1.lat,lng:e1.lng};S.time=pad(dd.getHours())+':'+pad(dd.getMinutes());
    S.days=[dd<new Date(dayStart(0))?ymdIn(1):ymd(dd)];S.formErr='';paint();return;
   case 'workweek':S.days=workdays();render();return;
   case 'clrdays':S.days=[];render();return;
   case 'dhome':S.dv='home';S.pt=null;S.pick=null;S.offer=null;S.offerErr='';paint();return;
   case 'go':
    var ti=$('#in-time');if(ti&&ti.value)S.time=ti.value;S.formErr='';
    if(!S.from.text.trim()||!S.to.text.trim()){S.formErr=T('حط من وين ولوين.','Enter both places.');render();return}
    if(!S.days.length){S.formErr=T('اختار نهار واحد على الأقل.','Pick at least one day.');render();return}
    S.days.sort();if(depDate()<new Date()){S.formErr=T('ساعة الطلعة مرقت لنهار اليوم. اختار وقت جاي أو شيل اليوم.','That time has already passed today. Pick a later time or untick today.');render();return}
    S.formErr='';S.busy=true;S.pick=null;render();
    computeRoutes().then(function(res){S.busy=false;S.routes=res.routes;S.dep=res.dep;S.sel=0;S.confirmed=false;S.pt=null;S.price=null;paint();fit(S.routes.map(function(r){return r.path}))})
     .catch(function(err){S.busy=false;var m=String(err&&err.message||err);
       if(m==='NO_ROUTE'||/NOT_FOUND|ZERO_RESULTS|geocod/i.test(m)){S.formErr=T('جوجل ما لقت طريق أو ما عرفت وحدة من المنطقتين. اختار من الاقتراحات أو حط النقطة عالخريطة.','Google found no route or did not recognise one of the places. Pick from the suggestions or set the point on the map.')}
       else showErr(T('ما قدرنا نجيب الطرقات','Could not get the routes'),m,explain(m));
       render()});
    return;
   case 'edit':S.formErr='';S.routes=null;S.confirmed=false;S.pt=null;paint();return;
   case 'confirm':S.confirmed=true;paint();return;
   case 'unconfirm':S.confirmed=false;S.pt=null;paint();return;
   case 'publish':var r=S.routes[S.sel],t2=$('#in-time2');if(t2&&t2.value&&t2.value!==S.time){S.time=t2.value;S.dep=depDate()}
    if(S.dep<new Date()){S.formErr=T('ساعة الطلعة مرقت. غيّر الساعة فوق لوقت جاي، وبعدين انشر.','The departure time has passed. Change the time above to a later one, then publish.');render();return}
    S.busy=true;render();
    // one ride per chosen day, same road and time; the traffic estimate comes from the first day
    var base={driverId:S.user.uid,driverName:S.me.name,car:S.me.car||'',plate:S.me.plate||'',fromText:S.from.text,toText:S.to.text,
      dur:r.dur,stat:r.stat,dist:r.dist,desc:r.desc||'',poly:r.enc,seats:S.seats,seatsLeft:S.seats,price:Math.min(S.price||suggestPrice(r.dist),capPrice(r.dist)),status:'open',createdAt:Date.now()};
    Promise.all(S.days.map(function(v){var o=Object.assign({},base);o.dep=depAt(v).getTime();return f.addDoc(col('rides'),o)}))
     .then(function(docs){S.busy=false;if(docs.length===1){S.dv='ride';S.rideId=docs[0].id;S.fresh=docs[0].id}else S.dv='home';resetNew();paint()}).catch(fail(T('نشر المشوار','posting the ride')));
    return;
   case 'reroute':R=myRide(S.rideId);if(!R||R.path.length<2)return;S.dv='reroute';S.pt=null;S.rr={busy:true,sel:0};paint();
    computeRoutes({from:R.path[0],to:R.path[R.path.length-1],dep:new Date(Math.max(R.dep,Date.now()+3*60000))}).then(function(res){if(S.dv!=='reroute')return;S.rr={routes:res.routes,sel:0};paint();fit(res.routes.map(function(r){return r.path}))})
     .catch(function(err){var m=String(err&&err.message||err);S.rr={err:T('ما قدرنا نجيب طرقات تانية. جرّب بعد شوي.','Could not get other routes. Try again shortly.')};paint();if(m!=='NO_ROUTE')showErr(T('ما قدرنا نجيب الطرقات','Could not get the routes'),m,explain(m))});return;
   case 'rrback':S.dv='ride';S.rr=null;paint();R=myRide(S.rideId);if(R)fit([R.path]);return;
   case 'rrapply':R=myRide(S.rideId);var nr=S.rr&&S.rr.routes&&S.rr.routes[S.rr.sel];if(!R||!nr)return;S.rr.saving=true;render();
    var bt=f.writeBatch(db);bt.update(ref('rides',R.id),{poly:nr.enc,dur:nr.dur,stat:nr.stat,dist:nr.dist,desc:nr.desc||'',seatsLeft:R.seats});
    reqsFor(R.id).forEach(function(x){if(x.status==='pending'||x.status==='offered'||x.status==='accepted')bt.update(ref('requests',x.id),{status:'rerouted',by:'driver',updatedAt:Date.now()})});
    bt.commit().then(function(){S.dv='ride';S.rr=null;paint();var R2=myRide(S.rideId);if(R2)fit([R2.path])}).catch(function(e){if(S.rr)S.rr.saving=false;fail(T('تغيير الطريق','changing the route'))(e)});return;
   case 'cancelride':R=myRide(S.rideId);if(!R)return;if(S.track&&S.track.docId===R.id)stopTrack();
    var b=f.writeBatch(db);b.update(ref('rides',R.id),{status:'cancelled'});
    reqsFor(R.id).forEach(function(x){if(x.status==='pending')b.update(ref('requests',x.id),{status:'rejected',by:'driver',updatedAt:Date.now()});else if(x.status==='accepted'||x.status==='offered'||x.status==='rerouted')b.update(ref('requests',x.id),{status:'cancelled',by:'driver',updatedAt:Date.now()})});
    b.commit().then(function(){S.dv='home';S.pt=null;paint()}).catch(fail(T('إلغاء المشوار','cancelling the ride')));return;
   case 'rgo':search();return;
   case 'redit':S.rv='home';S.found=null;paint();return;
   case 'rhome':unwatchRide();S.rv=S.found?'results':'home';S.reqId=null;S.reqRide=null;paint();return;
   case 'rreq':var x=S.found.ok[S.fsel],m=x.m;R=x.R;S.rbusy=true;render();
    f.addDoc(col('requests'),{rideId:R.id,driverId:R.driverId,riderId:S.user.uid,riderName:S.me.name,driverName:R.driverName,car:R.car||'',plate:R.plate||'',
      rideFrom:R.fromText,rideTo:R.toText,dep:R.dep,puText:S.rfrom.text,drText:S.rto.text,from:{lat:S.rfrom.lat,lng:S.rfrom.lng},pu:m.pu.pos,dr:m.dr.pos,puAt:m.puAt.getTime(),drAt:m.drAt.getTime(),km:Math.round(m.m),
      price:m.price,fee:r2(m.price*FEE),status:'pending',by:'rider',createdAt:Date.now(),updatedAt:Date.now()})
     .then(function(doc){S.rbusy=false;S.found=null;S.fresh=doc.id;openReq(doc.id,R.id)}).catch(fail(T('طلب المقعد','the seat request')));
    return;
   case 'viewshare':S.view='share';render();$('#sheet').scrollTop=0;return;
   case 'viewterms':S.view='terms';render();$('#sheet').scrollTop=0;return;
   case 'toadmin':S.view='admin';render();loadAdmin();return;
   case 'adrefresh':loadAdmin();return;
   case 'savewhish':var wn=digits(S.whDraft!=null?S.whDraft:(S.cfg&&S.cfg.whish)||'').replace(/[^\d+ ]/g,'').trim();
    f.setDoc(ref('config','app'),{whish:wn},{merge:true}).then(function(){S.whDraft=null;render()}).catch(fail('Whish'));return;
   case 'sharekey':f.setDoc(ref('config','app'),{mapsKey:S.key},{merge:true}).catch(fail(T('المفتاح','key')));return;
   case 'unsharekey':S.localKey=S.localKey||S.key;sset('kh-key',S.localKey);f.setDoc(ref('config','app'),{mapsKey:''},{merge:true}).catch(fail(T('المفتاح','key')));return;
   case 'chkey':sdel('kh-key');location.reload();return;
  }
});

boot();
})();
</script>
</body>
</html>
