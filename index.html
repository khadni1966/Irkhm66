<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>خدني</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@500;700&family=Readex+Pro:wght@400;500;600&display=swap">
<style>
/* Khedni trial. Accounts and shared rides live in Firebase; routes and traffic come from Google Maps. */
:root{
  --bg:#F3F5F2;--surface:#FFFFFF;--ink:#0E1F1A;--muted:#4F5F59;--line:#DCE3DF;--seg:#E7ECE8;
  --brand:#0B5D4B;--brand-ink:#FFFFFF;--brand-soft:#D9EBE5;--brand-deep:#073F33;
  --sun:#F5B921;--sun-ink:#0E1F1A;--sun-soft:#FFF1C7;--sun-soft-ink:#3F3A22;
  --danger:#B3261E;--danger-soft:#FBE4E2;--route:#1A6FE0;
  --display:'Alexandria','Readex Pro',Tahoma,sans-serif;--body:'Readex Pro',Tahoma,'Segoe UI',sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;display:flex;flex-direction:column}
h1,h2,h3,p{margin:0}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.sub{font-size:13px;color:var(--muted)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 18px;border:0;border-radius:16px;font-size:16px;font-weight:600;width:100%}
.btn.pri{background:var(--brand);color:var(--brand-ink)}
.btn.sun{background:var(--sun);color:var(--sun-ink)}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.warn{background:transparent;border:1px solid var(--danger);color:var(--danger)}
.btn.sm{min-height:44px;width:auto;font-size:14px;border-radius:12px;padding:0 14px;flex:none}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.grow{flex:1 1 auto;min-width:0}
.col{display:flex;flex-direction:column;gap:12px}
h2{font-family:var(--display);font-size:18px;overflow-wrap:anywhere}
h3{font-family:var(--display);font-size:15px;margin-top:6px}
.ltr{direction:ltr;text-align:left}
[dir=rtl] input.ltr{text-align:right}

/* sign-in, profile and key screens */
#gate{flex:1 1 auto;display:flex;flex-direction:column;padding:28px 22px;background:var(--brand);color:#fff;overflow-y:auto}
.gwrap{margin:auto 0;display:flex;flex-direction:column;gap:16px;width:100%;max-width:460px;align-self:center}
#gate h1{font-family:var(--display);font-size:52px;line-height:1.1}
#gate p{color:rgba(255,255,255,.9)}
#gate label,.glbl{font-size:13px}
#gate input{width:100%;min-height:54px;padding:0 14px;border:0;border-radius:14px;background:#fff;color:var(--ink);font-size:16px}
#gate .note{font-size:13px;color:rgba(255,255,255,.85)}
#gate .gerr{background:#fff;color:var(--danger);border-radius:12px;padding:10px 12px;font-size:14px;font-weight:500}
#gate .btn.ghost{border-color:rgba(255,255,255,.5);color:#fff}
#gate .seg{background:rgba(255,255,255,.16)}
#gate .seg button{color:#fff}
#gate .seg button[aria-pressed="true"]{background:#fff;color:var(--brand-deep)}
.pwrow{display:flex;gap:8px}
.pwrow button{flex:none;min-width:64px;min-height:54px;border:1px solid rgba(255,255,255,.5);border-radius:14px;background:transparent;color:#fff;font-size:14px}
.gload{display:flex;align-items:center;gap:12px;font-size:16px}

/* app */
#app{flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
.top{flex:none;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 14px;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{font-family:var(--display);font-size:22px;font-weight:700;color:var(--brand)}
.chipbtn{min-height:44px;padding:0 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface);font-size:13px;font-weight:600}
.mapwrap{position:relative;flex:1 1 36%;min-height:220px}
#map{position:absolute;inset:0}
.hint{position:absolute;top:10px;inset-inline:10px;padding:8px 12px;border-radius:12px;background:var(--ink);color:#fff;font-size:13px;text-align:center}
.sheet{flex:0 1 auto;max-height:62%;overflow-y:auto;display:flex;flex-direction:column;gap:12px;padding:14px 14px calc(16px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--line);border-radius:22px 22px 0 0;margin-top:-16px;position:relative}
#app.full .mapwrap{display:none}
#app.full .sheet{flex:1 1 auto;max-height:none;margin-top:0;border-radius:0;border-top:0}
.seg{display:flex;gap:4px;padding:4px;border-radius:999px;background:var(--seg)}
.seg button{flex:1 1 0;min-height:44px;border:0;border-radius:999px;background:transparent;font-size:15px;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink);font-weight:600}
.field{display:flex;flex-direction:column;gap:4px;min-width:0;position:relative}
.field label,.lbl{font-size:12px;color:var(--muted)}
.inrow{display:flex;gap:8px}
.sheet input[type=text],.sheet input[type=time],.sheet input[type=number],.sheet select{width:100%;min-height:52px;padding:0 14px;border:1px solid var(--line);border-radius:14px;background:var(--surface);font-size:15px;font-weight:600}
.pinbtn{flex:none;width:52px;height:52px;border:1px solid var(--line);border-radius:14px;background:var(--surface);display:flex;align-items:center;justify-content:center;color:var(--brand)}
.pinbtn[aria-pressed="true"]{background:var(--sun);border-color:var(--sun);color:var(--sun-ink)}
.sug{list-style:none;margin:0;padding:4px;border:1px solid var(--line);border-radius:14px;background:var(--surface);display:flex;flex-direction:column;gap:2px}
.sug button{display:block;width:100%;min-height:44px;padding:8px 10px;border:0;border-radius:10px;background:none;text-align:start;font-size:14px}
.sug button:hover,.sug button:focus-visible{background:var(--seg)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.err{color:var(--danger);font-size:13px;font-weight:500}
.rcard{display:flex;flex-direction:column;gap:8px;width:100%;padding:14px;border:1px solid var(--line);border-radius:18px;background:var(--surface);text-align:start}
button.rcard[aria-pressed="true"],.rcard.on{border:2px solid var(--route);padding:13px}
.rcard .t{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.rcard .name{font-size:15px;font-weight:600;min-width:0;overflow-wrap:anywhere}
.rcard .dur{font-family:var(--display);font-size:26px;font-weight:700;color:var(--brand);flex:none;font-variant-numeric:tabular-nums}
.rcard .meta{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13px;color:var(--muted)}
.tag{display:inline-flex;align-items:center;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:600}
.tag.fast,.tag.ok{background:var(--brand-soft);color:var(--brand-deep)}
.tag.jam,.tag.wait{background:var(--sun-soft);color:var(--sun-soft-ink)}
.tag.no{background:var(--danger-soft);color:var(--danger)}
.banner{padding:10px 12px;border-radius:14px;background:var(--sun-soft);color:var(--sun-soft-ink);font-size:14px}
.okbox{padding:12px;border-radius:14px;background:var(--brand-soft);color:var(--brand-deep);font-size:14px}
.box{display:flex;flex-direction:column;gap:10px;padding:14px;border:1px solid var(--line);border-radius:18px}
.kv{display:flex;justify-content:space-between;gap:12px;font-size:14px}
.kv span:first-child{color:var(--muted)}
.kv b{font-weight:600;text-align:end;overflow-wrap:anywhere;min-width:0}
.big{font-family:var(--display);font-size:34px;font-weight:700;line-height:1;color:var(--brand);font-variant-numeric:tabular-nums}
.stepper{display:flex;align-items:center;justify-content:space-between;min-height:52px;padding:0 4px;border:1px solid var(--line);border-radius:14px}
.stepper button{width:44px;height:44px;border:0;border-radius:12px;background:var(--seg);font-size:20px;font-weight:600}
.stepper b{font-family:var(--display);font-size:18px}
.spin{width:22px;height:22px;border-radius:50%;border:3px solid rgba(255,255,255,.4);border-top-color:#fff;animation:rot 1s linear infinite;flex:none}
@keyframes rot{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:3s}}
#errbox{position:fixed;inset-inline:10px;bottom:10px;z-index:50;max-height:60%;overflow:auto;padding:14px;border-radius:16px;background:var(--danger-soft);color:var(--ink);border:2px solid var(--danger);display:flex;flex-direction:column;gap:8px}
#errbox h3{font-size:16px;color:var(--danger);margin:0}
#errbox pre{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px;direction:ltr;text-align:left;background:#fff;border-radius:10px;padding:8px}
</style>
</head>
<body>

<section id="gate"></section>

<section id="app" hidden>
  <div class="top">
    <span class="brand" id="brand"></span>
    <div class="row" style="gap:6px">
      <button class="chipbtn" type="button" id="b-lang"></button>
      <button class="chipbtn" type="button" id="b-acct"></button>
    </div>
  </div>
  <div class="mapwrap"><div id="map"></div><div class="hint" id="hint" hidden></div></div>
  <div class="sheet" id="sheet"></div>
</section>

<div id="errbox" role="alert" hidden></div>

<script>
(function(){
'use strict';
/* Firebase web config. It identifies the project and is not a secret: access is decided by the database rules. */
var FB_CONFIG={apiKey:'AIzaSyDu_16hGFQWB8YO3G4u5Wtc8UIaZ_RP18U',authDomain:'khedni-df08b.firebaseapp.com',projectId:'khedni-df08b',storageBucket:'khedni-df08b.firebasestorage.app',messagingSenderId:'646263417160',appId:'1:646263417160:web:291d4f0723b5931894ab7d'};
var FB_BASE='https://www.gstatic.com/firebasejs/10.14.1/';
var MAIL='@phone.khedni.app'; // sign-in is phone + password; Firebase needs an email shape, so the phone becomes one. No email is ever sent.
var LIMIT=800;    // metres: how far a rider's point may be from the driver's road and still count as "on the way"
var FEE=0.10;     // Khedni's share, taken from the driver's part
var OWE_LIMIT=5;  // dollars a driver may owe before new requests can no longer be accepted

var $=function(s){return document.querySelector(s)};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
function sget(k){try{return localStorage.getItem(k)}catch(e){return null}}
function sset(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function sdel(k){try{localStorage.removeItem(k)}catch(e){}}

/* keep the last console errors: Google writes the exact reason there, and a phone has no console to read */
var LOG=[];
['error','warn'].forEach(function(k){var o=console[k];console[k]=function(){try{LOG.push(Array.prototype.slice.call(arguments).map(String).join(' '));if(LOG.length>10)LOG.shift()}catch(e){}return o.apply(console,arguments)}});

/* ---------- state ---------- */
function blank(){return {text:'',lat:null,lng:null}}
var S={lang:sget('kh-lang')==='en'?'en':'ar',key:'',localKey:sget('kh-key')||'',
  gate:'boot',bootMsg:'',bootFail:false,keyErr:'',
  af:{mode:'in',name:'',phone:'',pw:'',drv:false,car:'',plate:'',show:false,err:'',busy:false},
  user:null,me:null,admin:false,cfg:null,
  role:sget('kh-role')||'',view:'main',
  dv:'home',rideId:null,from:blank(),to:blank(),day:1,time:'07:30',busy:false,formErr:'',routes:null,sel:0,dep:null,confirmed:false,pt:null,seats:3,price:null,
  myRides:[],inReqs:[],pays:[],
  rv:'home',rfrom:blank(),rto:blank(),rday:1,rbusy:false,rErr:'',found:null,fsel:0,myReqs:[],reqId:null,reqRide:null,
  sug:{from:[],to:[],rfrom:[],rto:[]},pick:null,
  ad:null,adBusy:false,pay:{},applyErr:'',fresh:null,track:null,trackErr:'',live:null};
function T(ar,en){return S.lang==='en'?en:ar}

/* ---------- errors shown on screen, so a screenshot is enough to debug ---------- */
function showErr(title,detail,hint){
  var b=$('#errbox');
  b.innerHTML='<h3>'+esc(title)+'</h3>'+(hint?'<p>'+esc(hint)+'</p>':'')+(detail?'<pre>'+esc(detail)+'</pre>':'')+
    '<button class="btn sm ghost" type="button" id="errclose">'+T('سكّر','Close')+'</button>';
  b.hidden=false;
}
function explain(msg){
  msg=String(msg||'');
  if(/API key not valid|InvalidKey|API_KEY_INVALID/i.test(msg))return T('المفتاح مش صحيح. تأكد إنك نسخته كامل.','The key is not valid. Check that you copied all of it.');
  if(/has not been used|is disabled|SERVICE_DISABLED|not activated|ApiNotActivated/i.test(msg))return T('في خدمة مش مفعّلة بحساب جوجل. اسمها مكتوب بالرسالة تحت: فعّلها من صفحة جوجل.','A Google service is not enabled. Its name is in the message below: enable it in the Google console.');
  if(/RESOURCE_EXHAUSTED|quota|OVER_QUERY_LIMIT/i.test(msg))return T('وصلت للسقف اليومي اللي حطّيته. بيرجع يشتغل بكرا، أو ارفع السقف.','You reached the daily cap you set. It works again tomorrow, or raise the cap.');
  if(/billing|BillingNotEnabled/i.test(msg))return T('الفوترة مش مفعّلة عالمشروع.','Billing is not enabled on the project.');
  if(/referer|RefererNotAllowed|PERMISSION_DENIED|API_KEY_.*BLOCKED/i.test(msg))return T('المفتاح مقيّد وما بيسمح لهالصفحة أو لهالخدمة. راجع القيود بصفحة المفتاح.','The key is restricted and does not allow this page or this service. Review its restrictions on the key page.');
  if(/Failed to fetch|NetworkError|load failed/i.test(msg))return T('ما قدرنا نوصل لجوجل. تأكد من الإنترنت وجرّب مرة تانية.','Could not reach Google. Check your connection and try again.');
  return '';
}
window.addEventListener('error',function(e){showErr(T('صار خطأ بالصفحة','Something went wrong on the page'),(e.message||'')+(e.filename?'\n'+e.filename+':'+e.lineno:''),'')});
window.addEventListener('unhandledrejection',function(e){var m=(e.reason&&(e.reason.message||e.reason))||'';showErr(T('صار خطأ','Something went wrong'),String(m),explain(m))});
function mapErrHint(m){
  if(m==='ApiNotActivatedMapError')return T('خدمة Maps JavaScript API مش مفعّلة بالمشروع. فعّلها، نطور دقيقتين، وافتح الصفحة من جديد.','The Maps JavaScript API is not enabled on the project. Enable it, wait two minutes, and reopen this page.');
  if(m==='InvalidKeyMapError')return T('مفتاح الخرائط مش صحيح أو مش كامل. غيّره من "حسابي".','The maps key is wrong or incomplete. Change it under "Account".');
  if(m==='BillingNotEnabledMapError')return T('الفوترة مش مربوطة بهالمشروع.','Billing is not linked to this project.');
  if(m==='RefererNotAllowedMapError')return T('مفتاح الخرائط مقيّد على مواقع محدّدة وهالصفحة مش منها. ضيف عنوان هالصفحة بقيود المفتاح.','The maps key is restricted to specific websites and this page is not one of them. Add this page’s address to the key restrictions.');
  if(m==='ApiTargetBlockedMapError')return T('المفتاح مقيّد وما بيسمح بـMaps JavaScript API. ضيفها بـAPI restrictions.','The key is restricted and does not allow the Maps JavaScript API. Add it under API restrictions.');
  if(m==='ExpiredKeyMapError')return T('المفتاح منتهي أو لسا جديد. نطور 5 دقايق وجرّب.','The key has expired or is too new. Wait 5 minutes and try again.');
  return T('المفتاح غلط، أو الفوترة مش مفعّلة، أو خدمة Maps JavaScript API مش مفعّلة. السبب بالضبط مكتوب تحت إذا جوجل عطته.','The key is wrong, billing is off, or the Maps JavaScript API is not enabled. The exact reason is below if Google gave one.')}
window.gm_authFailure=function(){setTimeout(function(){var log=LOG.join('\n'),m=(log.match(/(\w+MapError)/)||[])[1]||'';showErr(T('جوجل رفضت مفتاح الخرائط','Google rejected the maps key')+(m?' · '+m:''),log||'gm_authFailure',mapErrHint(m))},500)};
function authErr(e){var c=String(e&&e.code||''),m=String(e&&e.message||e);
  if(/email-already-in-use/.test(c))return T('هالرقم عنده حساب من قبل. اكبس "دخول" وحط كلمة السر.','This number already has an account. Tap "Sign in" and enter the password.');
  if(/invalid-credential|wrong-password|user-not-found|invalid-login/.test(c))return T('الرقم أو كلمة السر غلط. إذا ما عندك حساب، اكبس "حساب جديد".','Wrong number or password. If you have no account, tap "New account".');
  if(/weak-password/.test(c))return T('كلمة السر لازم تكون 6 أحرف أو أكتر.','The password must be 6 characters or more.');
  if(/too-many-requests/.test(c))return T('محاولات كتير ورا بعض. نطور شوي وجرّب.','Too many attempts. Wait a little and try again.');
  if(/network-request-failed/.test(c))return T('ما في اتصال بالإنترنت. جرّب مرة تانية.','No internet connection. Try again.');
  if(/operation-not-allowed/.test(c))return T('الدخول بكلمة سر مش مفعّل بـFirebase (Authentication ← Email/Password).','Password sign-in is not enabled in Firebase (Authentication → Email/Password).');
  if(/unauthorized-domain/.test(c))return T('عنوان هالصفحة مش مسموح بـFirebase. ضيفه بـAuthentication ← Settings ← Authorized domains.','This page’s address is not allowed in Firebase. Add it under Authentication → Settings → Authorized domains.');
  if(/api-key/.test(c))return T('كود الربط بـFirebase مش صحيح.','The Firebase config is not valid.');
  if(/permission-denied/.test(c+m))return T('قاعدة البيانات رفضت تحفظ الحساب. قواعد الحماية (Rules) بعد ما انحطّت بـFirebase.','The database refused to save the account. The security rules are not set in Firebase yet.');
  return T('ما مشي الحال: ','That did not work: ')+(c||m)}
function dbErr(what,e){var c=String(e&&e.code||''),m=String(e&&e.message||e),h='';
  if(/permission-denied|insufficient permissions/i.test(c+m))h=T('قاعدة البيانات رفضت. يا قواعد الحماية (Rules) بعد ما انحطّت بـFirebase، يا حسابك ما بيسمحله بهالشي.','The database refused. Either the security rules are not set in Firebase yet, or your account is not allowed to do this.');
  else if(/unavailable|offline|network/i.test(c+m))h=T('ما في اتصال بالإنترنت. جرّب مرة تانية.','No internet connection. Try again.');
  showErr(T('ما مشي الحال','That did not work')+' · '+what,c+'\n'+m,h)}

/* ---------- helpers ---------- */
function pad(n){return ('0'+n).slice(-2)}
function hm(d){d=d instanceof Date?d:new Date(d);return d.getHours()+':'+pad(d.getMinutes())}
function r2(n){return Math.round(n*100)/100}
function durTxt(sec){var m=Math.max(1,Math.round(sec/60));if(m<60)return m+' '+T('د','min');var h=Math.floor(m/60),r=m%60;return h+' '+T('س','h')+(r?' '+pad(r)+' '+T('د','min'):'')}
function kmTxt(m){return (m>=10000?Math.round(m/1000):Math.round(m/100)/10)+' '+T('كم','km')}
function mTxt(m){return m<950?Math.round(m/10)*10+' '+T('م','m'):kmTxt(m)}
function money(n){return '<b dir="ltr">$'+String(r2(n))+'</b>'}
function secs(s){return parseInt(String(s||'0').replace('s',''),10)||0}
function dayName(n){return n===0?T('اليوم','Today'):n===1?T('بكرا','Tomorrow'):T('بعد بكرا','In 2 days')}
function dayStart(n){var d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()+n);return d.getTime()}
function dayOf(ms){var d=new Date(ms);d.setHours(0,0,0,0);var n=Math.round((d.getTime()-dayStart(0))/86400000);
  return n>=0&&n<=2?dayName(n):n===-1?T('مبارح','Yesterday'):new Date(ms).getDate()+'/'+(new Date(ms).getMonth()+1)}
function depDate(){var p=S.time.split(':'),d=new Date();d.setDate(d.getDate()+S.day);d.setHours(+p[0]||0,+p[1]||0,0,0);return d}
function digits(s){return String(s||'').replace(/[٠-٩]/g,function(c){return String(c.charCodeAt(0)-0x660)}).replace(/[۰-۹]/g,function(c){return String(c.charCodeAt(0)-0x6F0)})}
// Lebanese numbers in any spelling (03 123 456, +961 70 123 456, 0096170123456) become 961XXXXXXXX
function normPhone(s){var d=digits(s).replace(/\D/g,'');
  if(d.indexOf('00961')===0)d=d.slice(5);else if(d.indexOf('961')===0&&d.length>8)d=d.slice(3);
  if(d.charAt(0)==='0')d=d.slice(1);
  return /^\d{7,8}$/.test(d)?'961'+d:null}
function showPhone(p){p=String(p||'');return p.indexOf('961')===0?'+961 '+p.slice(3):p}
function decode(str){var i=0,lat=0,lng=0,out=[],b,shift,res;
  while(i<str.length){shift=0;res=0;do{b=str.charCodeAt(i++)-63;res|=(b&31)<<shift;shift+=5}while(b>=32);lat+=(res&1)?~(res>>1):(res>>1);
    shift=0;res=0;do{b=str.charCodeAt(i++)-63;res|=(b&31)<<shift;shift+=5}while(b>=32);lng+=(res&1)?~(res>>1):(res>>1);
    out.push({lat:lat/1e5,lng:lng/1e5})}
  return out}
function hav(a,b){var R=6371000,x=(b.lat-a.lat)*Math.PI/180,y=(b.lng-a.lng)*Math.PI/180,s=Math.sin(x/2)*Math.sin(x/2)+Math.cos(a.lat*Math.PI/180)*Math.cos(b.lat*Math.PI/180)*Math.sin(y/2)*Math.sin(y/2);return 2*R*Math.asin(Math.sqrt(s))}
function withCum(path){var c=[0];for(var i=1;i<path.length;i++)c[i]=c[i-1]+hav(path[i-1],path[i]);return c}
function total(R){return R.cum[R.cum.length-1]||1}
// closest point on the road itself (not just its corners): distance in metres, and how far along the road it is
function nearestOnPath(R,p){var best={d:1e12,cum:0,pos:R.path[0]},kx=Math.cos(p.lat*Math.PI/180)*111320,ky=110540;
  for(var i=0;i<R.path.length-1;i++){var a=R.path[i],b=R.path[i+1],ax=(a.lng-p.lng)*kx,ay=(a.lat-p.lat)*ky,bx=(b.lng-p.lng)*kx,by=(b.lat-p.lat)*ky,dx=bx-ax,dy=by-ay,L=dx*dx+dy*dy,t=L?Math.max(0,Math.min(1,-(ax*dx+ay*dy)/L)):0,x=ax+t*dx,y=ay+t*dy,d=Math.sqrt(x*x+y*y);
    if(d<best.d)best={d:d,cum:R.cum[i]+t*(R.cum[i+1]-R.cum[i]),pos:{lat:a.lat+(b.lat-a.lat)*t,lng:a.lng+(b.lng-a.lng)*t}}}
  return best}
function at(R,c){var i=1;while(i<R.cum.length-1&&R.cum[i]<c)i++;var seg=(R.cum[i]-R.cum[i-1])||1,t=(c-R.cum[i-1])/seg,a=R.path[i-1],b=R.path[i];return {lat:a.lat+(b.lat-a.lat)*t,lng:a.lng+(b.lng-a.lng)*t}}
function sub(R,c0,c1){var out=[at(R,c0)];for(var i=0;i<R.path.length;i++)if(R.cum[i]>c0&&R.cum[i]<c1)out.push(R.path[i]);out.push(at(R,c1));return out}
function etaOn(R,dep,c){return new Date(+dep+c/total(R)*R.dur*1000)}
function suggestPrice(m){return Math.max(1,Math.round(m/1000*0.05*2)/2)}
// a ride as stored keeps its road as Google's encoded line; decode it once per ride
var HY={};
function hyd(r){var h=HY[r.id];if(!h||h.poly!==r.poly){var p=decode(r.poly||'');h=HY[r.id]={poly:r.poly,path:p,cum:withCum(p)}}r.path=h.path;r.cum=h.cum;return r}

/* ---------- Firebase: accounts and shared data ---------- */
var F=null,auth=null,db=null,unsubs=[],got={rides:false,reqs:false},creating=false,tidied={};
function col(n){return F.f.collection(db,n)}
function ref(n,id){return F.f.doc(db,n,id)}

function boot(){

  if(!FB_CONFIG){S.bootFail=true;S.bootMsg=T('التطبيق بعد ما انربط بقاعدة البيانات.','The app is not connected to its database yet.');showGate();return}

    var app=m[0].initializeApp(FB_CONFIG);F={a:m[1],f:m[2]};auth=m[1].getAuth(app);db=m[2].getFirestore(app);
    m[1].onAuthStateChanged(auth,onAuth);
  }).catch(function(e){S.bootFail=true;S.bootMsg=T('ما قدرنا نحمّل التطبيق. تأكد من الإنترنت وافتح الصفحة من جديد.','Could not load the app. Check your connection and reopen the page.');showGate();showErr(T('ما قدرنا نحمّل التطبيق','Could not load the app'),String(e&&e.message||e),'')});

function onAuth(u){
  unsubs.forEach(function(fn){try{fn()}catch(e){}});unsubs=[];got={rides:false,reqs:false};
  unwatchLive();S.track=null;S.trackErr='';S.user=u;S.me=null;S.admin=false;S.cfg=null;S.myRides=[];S.inReqs=[];S.myReqs=[];S.pays=[];S.ad=null;
  S.view='main';S.dv='home';S.rv='home';S.routes=null;S.confirmed=false;S.found=null;S.pick=null;S.pt=null;
  if(!u){S.gate='auth';showGate();return}
  S.gate='boot';S.bootMsg=T('عم نفتح حسابك…','Opening your account…');showGate();
  listen(ref('users',u.uid),function(snap){
    if(!snap.exists()){if(creating)return;S.me=null;S.gate='profile';showGate();return}
    var first=!S.me;S.me=snap.data();

function enter(){
  var uid=S.user.uid,f=F.f;
  if(S.role!=='driver'&&S.role!=='rider')S.role=S.me.dstatus&&S.me.dstatus!=='none'?'driver':'rider';
  f.getDoc(ref('adminping','x')).then(function(){S.admin=true;paint()}).catch(function(){S.admin=false});
  listen(f.query(col('rides'),f.where('driverId','==',uid)),function(s){S.myRides=rows(s).map(hyd);got.rides=true;upkeep();paint()},T('المشاوير','rides'));
  listen(f.query(col('requests'),f.where('driverId','==',uid)),function(s){S.inReqs=rows(s);got.reqs=true;upkeep();if(S.track&&S.track.pos)sendLive(true);paint()},T('الطلبات','requests'));
  listen(f.query(col('requests'),f.where('riderId','==',uid)),function(s){S.myReqs=rows(s);paint()},T('حجوزاتي','bookings'));
  listen(f.query(col('payments'),f.where('driverId','==',uid)),function(s){S.pays=rows(s);paint()},T('الدفعات','payments'));
  listen(ref('config','app'),function(s){S.cfg=s.exists()?s.data():{};ensureMap();paint()},T('الإعدادات','settings'));
}
// the driver's own phone keeps each ride tidy: free seats match the accepted riders, and finished rides are closed
var upTimer=0;
function upkeep(){clearTimeout(upTimer);upTimer=setTimeout(function(){
  if(!got.rides||!got.reqs||!S.user)return;var now=Date.now();
  S.myRides.forEach(function(R){
    if(R.status!=='open'||tidied[R.id])return;
    var acc=S.inReqs.filter(function(q){return q.rideId===R.id&&q.status==='accepted'}).length,want=Math.max(0,R.seats-acc),
      fix=R.dep+R.dur*1000<now-2*3600000?{status:'done'}:R.seatsLeft!==want?{seatsLeft:want}:null;
    if(!fix)return;
    tidied[R.id]=1;F.f.updateDoc(ref('rides',R.id),fix).catch(function(){}).then(function(){delete tidied[R.id]});
  })},900)}
function myRide(id){for(var i=0;i<S.myRides.length;i++)if(S.myRides[i].id===id)return S.myRides[i];return null}
function myReq(id){for(var i=0;i<S.myReqs.length;i++)if(S.myReqs[i].id===id)return S.myReqs[i];return null}
function reqsFor(id){return S.inReqs.filter(function(q){return q.rideId===id}).sort(function(a,b){return a.puAt-b.puAt})}
function ledger(){var fees=0,paid=0;S.inReqs.forEach(function(q){if(q.status==='accepted')fees+=q.fee||0});S.pays.forEach(function(p){paid+=p.amount||0});return {fees:r2(fees),paid:r2(paid),owed:r2(fees-paid)}}

/* ---------- Google: load, map, places, routes ---------- */
var map=null,ov=[],places=null,token=null,mapState='none';
function ensureMap(){
  if(mapState==='ready'){if(S.gate){hideGate();initMap();paint()}return}
  if(mapState==='loading')return;
  var key=(S.cfg&&S.cfg.mapsKey)||S.localKey;
  if(!key){S.gate='key';showGate();return}
  mapState='loading';S.key=key;S.gate='boot';S.bootMsg=T('عم نحمّل الخريطة…','Loading the map…');showGate();
  loadMaps(key).then(function(){mapState='ready';if(!S.user||!S.me)return;hideGate();initMap();paint()})
   .catch(function(){mapState='none';S.keyErr=T('ما قدرنا نحمّل خرائط جوجل. تأكد من الإنترنت وجرّب مرة تانية.','Could not load Google Maps. Check your connection and try again.');S.gate='key';showGate()});
}
function loadMaps(key){return new Promise(function(res,rej){
  window.__khReady=function(){res()};
  var s=document.createElement('script');
  s.src='https://maps.googleapis.com/maps/api/js?key='+encodeURIComponent(key)+'&v=weekly&loading=async&libraries=places&language='+S.lang+'&region=LB&callback=__khReady';
  s.async=true;s.onerror=function(){rej(new Error('Failed to fetch Google Maps script'))};document.head.appendChild(s)})}
function initMap(){
  if(map)return;
  map=new google.maps.Map($('#map'),{center:{lat:33.86,lng:35.56},zoom:11,disableDefaultUI:true,zoomControl:true,gestureHandling:'greedy',clickableIcons:false});
  map.addListener('click',tapEvt);
  google.maps.importLibrary('places').then(function(lib){places=lib;try{token=new lib.AutocompleteSessionToken()}catch(e){}}).catch(function(){places=null});
}
function tapEvt(e){onMapTap({lat:e.latLng.lat(),lng:e.latLng.lng()})}
function add(o){ov.push(o);return o}
function line(path,color,w,op,z,onClick){var l=add(new google.maps.Polyline({path:path,map:map,strokeColor:color,strokeWeight:w,strokeOpacity:op,zIndex:z}));l.addListener('click',onClick||tapEvt);return l}
function pin(pos,label){return add(new google.maps.Marker({position:{lat:pos.lat,lng:pos.lng},map:map,label:{text:label,color:'#FFFFFF',fontWeight:'700'}}))}
function dot(pos,fill){return add(new google.maps.Marker({position:{lat:pos.lat,lng:pos.lng},map:map,zIndex:20,icon:{path:google.maps.SymbolPath.CIRCLE,scale:9,fillColor:fill,fillOpacity:1,strokeColor:'#0E1F1A',strokeWeight:3}}))}
function car(pos){return add(new google.maps.Marker({position:{lat:pos.lat,lng:pos.lng},map:map,zIndex:40,label:{text:'🚗',fontSize:'18px'},icon:{path:google.maps.SymbolPath.CIRCLE,scale:16,fillColor:'#FFFFFF',fillOpacity:1,strokeColor:'#0B5D4B',strokeWeight:3}}))}
function ends(R){if(R.path.length){pin(R.path[0],'A');pin(R.path[R.path.length-1],'B')}}
function redraw(){
  if(!map)return;ov.forEach(function(o){o.setMap(null)});ov=[];
  if(S.view!=='main'||!S.me)return;
  if(S.role==='driver'){
    if(S.me.dstatus!=='active')return;
    if(S.dv==='new'&&S.routes){
      S.routes.forEach(function(r,i){var on=i===S.sel;if(S.confirmed&&!on)return;
        line(r.path,on?'#1A6FE0':'#6F7D78',on?7:5,on?1:.7,on?10:1,function(e){if(i!==S.sel&&!S.confirmed){S.sel=i;S.pt=null;paint()}else tapEvt(e)})});
      ends(S.routes[S.sel]);if(S.pt&&S.pt.pos)dot(S.pt.pos,'#F5B921');return}
    if(S.dv==='ride'){var R=myRide(S.rideId);if(!R)return;
      line(R.path,'#1A6FE0',7,1,10);ends(R);if(S.pt&&S.pt.pos)dot(S.pt.pos,'#F5B921');if(S.track&&S.track.rideId===R.id&&S.track.pos)car(S.track.pos);
      reqsFor(R.id).forEach(function(q){if(q.status==='pending'||q.status==='accepted'){dot(q.pu,'#F5B921');dot(q.dr,'#FFFFFF')}})}
    return}
  if(S.rv==='results'&&S.found&&S.found.ok.length){var x=S.found.ok[S.fsel]||S.found.ok[0];
    line(x.R.path,'#1A6FE0',6,.75,10);line(sub(x.R,x.m.pu.cum,x.m.dr.cum),'#0B5D4B',9,1,15)}
  if(S.rv==='req'){var q=myReq(S.reqId);if(q){
    if(S.reqRide&&S.reqRide.id===q.rideId){var RR=S.reqRide,a=nearestOnPath(RR,q.pu),b=nearestOnPath(RR,q.dr);line(RR.path,'#1A6FE0',6,.75,10);if(b.cum>a.cum)line(sub(RR,a.cum,b.cum),'#0B5D4B',9,1,15)}
    dot(q.pu,'#F5B921');dot(q.dr,'#FFFFFF');var li=q.status==='accepted'?liveInfo(q):null;if(li)car(li.pos);return}}
  if(S.rfrom.lat!=null)dot(S.rfrom,'#F5B921');
  if(S.rto.lat!=null)dot(S.rto,'#FFFFFF');
}
function fit(paths){if(!map)return;var b=new google.maps.LatLngBounds(),n=0;paths.forEach(function(p){if(!p||!p.length)return;for(var i=0;i<p.length;i+=Math.max(1,Math.floor(p.length/60))){b.extend(p[i]);n++}b.extend(p[p.length-1])});if(n)map.fitBounds(b,40)}
function waypoint(p){return p.lat!=null?{location:{latLng:{latitude:p.lat,longitude:p.lng}}}:{address:p.text+(/lebanon|لبنان/i.test(p.text)?'':', Lebanon')}}
function computeRoutes(){
  var dep=depDate(),min=new Date(Date.now()+2*60000);
  var body={origin:waypoint(S.from),destination:waypoint(S.to),travelMode:'DRIVE',routingPreference:'TRAFFIC_AWARE_OPTIMAL',
    departureTime:(dep<min?min:dep).toISOString(),computeAlternativeRoutes:true,languageCode:S.lang,regionCode:'LB',units:'METRIC'};
  return fetch('https://routes.googleapis.com/directions/v2:computeRoutes',{method:'POST',
    headers:{'Content-Type':'application/json','X-Goog-Api-Key':S.key,'X-Goog-FieldMask':'routes.duration,routes.staticDuration,routes.distanceMeters,routes.description,routes.routeLabels,routes.polyline.encodedPolyline'},
    body:JSON.stringify(body)})
   .then(function(r){return r.json().then(function(j){return {ok:r.ok,j:j}})})
   .then(function(x){
     if(!x.ok||x.j.error)throw new Error((x.j.error&&(x.j.error.status+': '+x.j.error.message))||'Routes API error');
     var rs=(x.j.routes||[]).filter(function(r){return r.polyline&&r.polyline.encodedPolyline});
     if(!rs.length)throw new Error('NO_ROUTE');
     return {dep:dep,routes:rs.map(function(r){var path=decode(r.polyline.encodedPolyline);return {enc:r.polyline.encodedPolyline,path:path,cum:withCum(path),dur:secs(r.duration),stat:secs(r.staticDuration),dist:r.distanceMeters||0,desc:r.description||''}})}});
}
var sugTimer=0,sugSeq=0;
function suggest(which,text){
  clearTimeout(sugTimer);
  if(!places||text.trim().length<2){S.sug[which]=[];paintSug(which);return}
  sugTimer=setTimeout(function(){var seq=++sugSeq;
    places.AutocompleteSuggestion.fetchAutocompleteSuggestions({input:text,sessionToken:token||undefined,language:S.lang,region:'lb',includedRegionCodes:['lb']})
     .then(function(res){if(seq!==sugSeq)return;S.sug[which]=(res.suggestions||[]).filter(function(s){return s.placePrediction}).slice(0,5);paintSug(which)})
     .catch(function(){S.sug[which]=[];paintSug(which)})},350);
}
function paintSug(which){var el=$('#sug-'+which);if(!el)return;var list=S.sug[which];
  el.hidden=!list.length;
  el.innerHTML=list.map(function(s,i){return '<li><button type="button" data-sug="'+which+'" data-i="'+i+'">'+esc(s.placePrediction.text.toString())+'</button></li>'}).join('')}
function chooseSug(which,i){var s=S.sug[which][i];if(!s)return;var txt=s.placePrediction.text.toString(),place=s.placePrediction.toPlace();
  var slot={text:txt,lat:null,lng:null};S[which]=slot;S.sug[which]=[];render();
  place.fetchFields({fields:['displayName','location']}).then(function(){
    if(place.location&&S[which]===slot){slot.lat=place.location.lat();slot.lng=place.location.lng();map.panTo({lat:slot.lat,lng:slot.lng});redraw()}
    try{token=new places.AutocompleteSessionToken()}catch(e){}
  }).catch(function(){/* the typed name is still sent to Google as an address */})}

/* ---------- map taps: set a point, or ask when the driver passes a point ---------- */
function onMapTap(p){
  if(S.pick){var w=S.pick;S[w]={text:T('نقطة عالخريطة','Point on the map'),lat:p.lat,lng:p.lng};S.pick=null;paint();return}
  if(S.view!=='main'||S.role!=='driver')return;
  var R=S.dv==='ride'?myRide(S.rideId):(S.dv==='new'&&S.routes?S.routes[S.sel]:null);if(!R)return;
  var n=nearestOnPath(R,p);
  S.pt=n.d>700?{far:true}:{at:etaOn(R,S.dv==='ride'?R.dep:S.dep,n.cum),km:n.cum,pos:n.pos};
  paint();
}
/* ---------- rider: is my trip on this driver's road? ---------- */
function matchRide(R){
  if(R.seatsLeft<1)return {ok:false,why:'full'};
  var a=nearestOnPath(R,S.rfrom),b=nearestOnPath(R,S.rto);
  if(a.d>LIMIT)return {ok:false,why:'farpu',d:a.d};
  if(b.d>LIMIT)return {ok:false,why:'fardr',d:b.d};
  if(b.cum-a.cum<300)return {ok:false,why:'order'};
  return {ok:true,pu:a,dr:b,puAt:etaOn(R,R.dep,a.cum),drAt:etaOn(R,R.dep,b.cum),m:b.cum-a.cum,price:Math.max(.5,Math.round(R.price*(b.cum-a.cum)/total(R)*2)/2)}}
function search(){
  if(S.rfrom.lat==null||S.rto.lat==null){S.rErr=T('اختار النقطتين من الاقتراحات، أو حطّهم عالخريطة بكبسة الدبّوس.','Pick both points from the suggestions, or set them on the map with the pin button.');render();return}
  S.rErr='';S.rbusy=true;S.pick=null;render();
  var f=F.f,uid=S.user.uid,now=Date.now(),d0=dayStart(S.rday),d1=dayStart(S.rday+1);
  f.getDocs(f.query(col('rides'),f.where('status','==','open'))).then(function(s){
    var all=rows(s).filter(function(r){return r.dep>now&&r.dep>=d0&&r.dep<d1&&r.driverId!==uid}).map(hyd).filter(function(r){return r.path.length>1});
    var res=all.map(function(R){return {R:R,m:matchRide(R)}});
    S.found={total:all.length,ok:res.filter(function(x){return x.m.ok}).sort(function(a,b){return a.m.puAt-b.m.puAt})};
    S.fsel=0;S.rv='results';S.rbusy=false;paint();
    if(S.found.ok.length)fit([S.found.ok[0].R.path]);
  }).catch(function(e){S.rbusy=false;render();dbErr(T('البحث','search'),e)});
}
function openReq(id,rideId){S.rv='req';S.reqId=id;S.reqRide=null;paint();var q=myReq(id);if(q)fit([[q.pu,q.dr]]);rideId=rideId||(q&&q.rideId);if(!rideId)return;
  F.f.getDoc(ref('rides',rideId)).then(function(s){if(!s.exists()||S.reqId!==id)return;var R=s.data();R.id=s.id;S.reqRide=hyd(R);paint();if(S.rv==='req')fit([S.reqRide.path])}).catch(function(){});
}

/* ---------- live location: the driver shares it, a confirmed rider watches it ---------- */
// A web page can only read the position while it is open and on screen, so the driver's screen is kept awake.
var wake=null;
function keepAwake(){try{if(S.track&&navigator.wakeLock&&document.visibilityState==='visible')navigator.wakeLock.request('screen').then(function(w){wake=w}).catch(function(){})}catch(e){}}
document.addEventListener('visibilitychange',keepAwake);
function sendLive(on){var t=S.track;if(!t||!S.user)return;
  var d={driverId:S.user.uid,on:on,at:Date.now(),riders:S.inReqs.filter(function(q){return q.rideId===t.rideId&&q.status==='accepted'}).map(function(q){return q.riderId})};
  if(on&&t.pos){d.lat=t.pos.lat;d.lng=t.pos.lng}
  t.sent=d.at;t.sentPos=t.pos;
  F.f.setDoc(ref('live',t.rideId),d).catch(function(e){if(!t.failed){t.failed=true;dbErr(T('مشاركة الموقع','location sharing'),e)}})}
function startTrack(rideId){
  if(!navigator.geolocation){S.trackErr=T('هالمتصفح ما بيعطي الموقع. افتح الصفحة بـChrome.','This browser does not give a location. Open the page in Chrome.');render();return}
  if(S.track)stopTrack();
  S.trackErr='';var t=S.track={rideId:rideId,pos:null,sent:0,sentPos:null,id:null,timer:0,failed:false};
  // send every 10 s while moving and every 30 s while stopped; the timer covers a phone that reports no new fix
  var due=function(){if(S.track!==t||!t.pos)return;var gap=Date.now()-t.sent,moved=t.sentPos?hav(t.sentPos,t.pos):1e9;if(gap>=30000||(gap>=10000&&moved>15))sendLive(true)};
  t.timer=setInterval(due,5000);
  t.id=navigator.geolocation.watchPosition(function(p){if(S.track!==t)return;
      t.pos={lat:p.coords.latitude,lng:p.coords.longitude};S.trackErr='';
      due();paint()},
    function(e){if(S.track!==t)return;
      if(e.code===1){stopTrack();S.trackErr=T('الموقع ممنوع عن هالصفحة. اكبس على القفل حد عنوان الموقع، اسمح بالـLocation، وجرّب مرة تانية. إذا الصفحة مفتوحة جوّا تطبيق تاني، افتحها بـChrome.','Location is blocked for this page. Tap the lock next to the address, allow Location, and try again. If the page is open inside another app, open it in Chrome.')}
      else S.trackErr=T('ما قدرنا نحدّد موقعك. تأكد إنو الـGPS شغّال.','Could not get your position. Check that GPS is on.');
      render()},
    {enableHighAccuracy:true,maximumAge:5000,timeout:30000});
  keepAwake();paint()}
function stopTrack(){var t=S.track;if(!t)return;clearInterval(t.timer);try{navigator.geolocation.clearWatch(t.id)}catch(e){}
  t.pos=null;t.failed=true;sendLive(false);S.track=null;try{if(wake){wake.release();wake=null}}catch(e){}paint()}
var liveUnsub=null,liveId=null;

function syncLive(){var q=S.me&&S.view==='main'&&S.role==='rider'&&S.rv==='req'?myReq(S.reqId):null,id=q&&q.status==='accepted'?q.rideId:null;
  if(id===liveId)return;unwatchLive();if(!id)return;liveId=id;
  liveUnsub=F.f.onSnapshot(ref('live',id),function(s){if(liveId!==id)return;S.live=s.exists()?s.data():null;paint()},
    function(){if(liveId!==id)return;S.live=null;liveUnsub=null;setTimeout(function(){if(liveId===id&&!liveUnsub){liveId=null;paint()}},15000)})}
// where the car is for this rider: straight-line distance, and when the route is known, distance and time left along it
function liveInfo(q){var L=S.live;if(!L||!L.on||L.lat==null)return null;var age=Date.now()-L.at;if(age>10*60000)return null;
  var pos={lat:L.lat,lng:L.lng},o={pos:pos,age:age,d:hav(pos,q.pu),left:null,eta:null},R=S.reqRide;
  if(R&&R.id===q.rideId&&R.path.length>1){var c=nearestOnPath(R,pos),p=nearestOnPath(R,q.pu);
    if(c.d<1500){o.left=p.cum-c.cum;if(o.left>0)o.eta=new Date(Date.now()+o.left/total(R)*R.dur*1000)}}
  return o}

/* rider */
function reqTag(q){return q.status==='pending'?'<span class="tag wait">'+T('ناطر السائق','Waiting for the driver')+'</span>':q.status==='accepted'?'<span class="tag ok">'+T('مأكّد','Confirmed')+'</span>':q.status==='rejected'?'<span class="tag no">'+T('السائق ما قبل','Declined')+'</span>':'<span class="tag no">'+(q.by==='driver'?T('السائق لغى','Cancelled by the driver'):T('ملغى','Cancelled'))+'</span>'}
function liveReqs(){var now=Date.now();return S.myReqs.filter(function(q){return q.drAt>now-3*3600000&&(q.status==='pending'||q.status==='accepted'||(q.updatedAt||0)>now-12*3600000)}).sort(function(a,b){return a.puAt-b.puAt})}
function riderHTML(){
  if(S.rv==='req'){var q=myReq(S.reqId);if(q){S.fresh=null;return reqHTML(q)}if(S.fresh===S.reqId)return '<p class="sub" role="status">'+T('عم نبعت الطلب…','Sending the request…')+'</p>';S.rv='home'}
  if(S.rv==='results'&&S.found)return resultsHTML();
  var mine=liveReqs();
  return (mine.length?'<h2>'+T('حجوزاتي','My bookings')+'</h2>'+mine.map(function(q){
     return '<button type="button" class="rcard" data-req="'+q.id+'"><span class="t"><span class="name">'+esc(q.driverName)+' · '+esc(q.rideFrom)+ARROW()+esc(q.rideTo)+'</span><span class="dur" dir="ltr">'+hm(q.puAt)+'</span></span><span class="meta"><span>'+dayOf(q.puAt)+'</span>'+reqTag(q)+'</span></button>'}).join(''):'')+
   '<h2>'+T('لوين رايح؟','Where are you going?')+'</h2>'+
   fieldHTML('rfrom',T('من وين بتطلع','Where you get in'))+fieldHTML('rto',T('لوين نازل','Where you get out'))+
   '<div class="field"><label for="in-rday">'+T('أي نهار','Day')+'</label>'+daySel('in-rday',S.rday)+'</div>'+
   (S.rErr?'<p class="err" role="alert">'+esc(S.rErr)+'</p>':'')+
   '<button class="btn sun" type="button" id="rgo"'+(S.rbusy?' disabled':'')+'>'+(S.rbusy?T('عم نفتّش…','Searching…'):T('مين نازل عطريقي؟','Who is going my way?'))+'</button>'+
   '<p class="sub">'+T('بنفتّش بين السائقين اللي ناشرين مشوار بهالنهار، وبنبيّنلك اللي طريقهم بيمرق حدّك.','We look through the drivers who posted a ride that day and show the ones whose road passes near you.')+'</p>';
}

  var fee={},paid={},tf=0,tp=0;

  A.pays.forEach(function(p){paid[p.driverId]=(paid[p.driverId]||0)+(p.amount||0);tp+=p.amount||0});
  var pend=A.users.filter(function(u){return u.dstatus==='pending'}),drv=A.users.filter(function(u){return u.dstatus==='active'||u.dstatus==='blocked'}),shared=S.cfg&&S.cfg.mapsKey;

   '<h3>'+T('سائقين ناطرين الموافقة','Drivers awaiting approval')+' ('+pend.length+')</h3>'+

function loadAdmin(){var f=F.f;S.adBusy=true;render();
  Promise.all([f.getDocs(col('users')),f.getDocs(f.query(col('requests'),f.where('status','==','accepted'))),f.getDocs(col('payments'))])
   .then(function(r){S.ad={users:rows(r[0]).sort(function(a,b){return (b.createdAt||0)-(a.createdAt||0)}),reqs:rows(r[1]),pays:rows(r[2])};S.adBusy=false;render()})
   .catch(function(e){S.adBusy=false;render();dbErr(T('الإدارة','admin'),e)});
}

function render(){

  $('#brand').textContent=T('خدني','Khedni');$('#b-lang').textContent=T('English','عربي');$('#b-acct').textContent=S.view==='main'?T('حسابي','Account'):T('رجوع','Back');
  var h=$('#hint');
  if(S.pick&&S.view==='main'){h.hidden=false;h.textContent=T('اكبس عالخريطة لتحط ','Tap the map to set ')+T(PICKTXT[S.pick][0],PICKTXT[S.pick][1])}else h.hidden=true;
  $('#app').classList.toggle('full',S.view!=='main');
  var html=S.view==='account'?accountHTML():S.view==='admin'?adminHTML():roleSeg()+(S.role==='driver'?driverHTML():riderHTML());
  if(html===lastHTML)return;
  var el=document.activeElement,active=el&&el.id&&$('#sheet').contains(el)?el.id:null,pos=null;
  if(active){try{pos=el.selectionStart}catch(e){}}
  $('#sheet').innerHTML=html;lastHTML=html;
  ['from','to','rfrom','rto'].forEach(paintSug);
  if(active){el=document.getElementById(active);if(el){el.focus();if(pos!=null){try{el.setSelectionRange(pos,pos)}catch(e){}}}}
}
function paint(){if(S.gate)return;syncLive();redraw();render()}

/* ---------- actions ---------- */
function fail(what){return function(e){S.busy=false;S.rbusy=false;render();dbErr(what,e)}}
function setReq(q,status,by){var f=F.f,b=f.writeBatch(db),R=myRide(q.rideId);
  b.update(ref('requests',q.id),{status:status,by:by,updatedAt:Date.now()});
  if(by==='driver'&&R){if(status==='accepted')b.update(ref('rides',R.id),{seatsLeft:Math.max(0,R.seatsLeft-1)});else if(q.status==='accepted')b.update(ref('rides',R.id),{seatsLeft:Math.min(R.seats,R.seatsLeft+1)})}
  return b.commit().catch(fail(T('الطلب','request')))}
function inReq(id){for(var i=0;i<S.inReqs.length;i++)if(S.inReqs[i].id===id)return S.inReqs[i];return null}
function switchLang(){S.lang=S.lang==='en'?'ar':'en';sset('kh-lang',S.lang);if(window.google&&google.maps){location.reload()}else if(S.gate)showGate()}
function resetNew(){S.routes=null;S.confirmed=false;S.pt=null;S.price=null;S.formErr='';S.from=blank();S.to=blank()}

document.addEventListener('submit',function(e){e.preventDefault();
  if(e.target.id==='authform')doAuth();
  else if(e.target.id==='profform')doProfile();
  else if(e.target.id==='keyform'){var k=$('#key').value.trim();
    if(!/^AIza[\w-]{30,}$/.test(k)){S.keyErr=T('المفتاح لازم يبلّش بـAIza ويكون حوالي 39 حرف. انسخه كامل من كبسة النسخ.','The key must start with AIza and be about 39 characters. Copy all of it with the copy button.');showGate();return}
    S.keyErr='';S.localKey=k;sset('kh-key',k);ensureMap()}
});
document.addEventListener('input',function(e){var d=e.target.dataset||{},w=d.in;
  if(d.af){S.af[d.af]=e.target.value;return}
  if(d.pay){S.pay[d.pay]=e.target.value;return}
  if(w){S[w]={text:e.target.value,lat:null,lng:null};suggest(w,e.target.value)}
  if(e.target.id==='in-time')S.time=e.target.value||'07:30';
  if(e.target.id==='in-price'){var v=parseFloat(e.target.value);if(v>0)S.price=r2(v)}});
document.addEventListener('change',function(e){if(e.target.id==='in-day')S.day=+e.target.value;if(e.target.id==='in-rday')S.rday=+e.target.value});
document.addEventListener('click',function(e){var t=e.target.closest('button');if(!t)return;var d=t.dataset,f=F&&F.f,q,R;
  if(t.id==='errclose'){$('#errbox').hidden=true;return}
  if(t.id==='g-lang'||t.id==='b-lang'){switchLang();return}
  if(!F)return;
  /* before the app */
  if(d.amode){S.af.mode=d.amode;S.af.err='';showGate();return}
  if(d.drv){S.af.drv=d.drv==='1';showGate();return}
  if(t.id==='af-show'){S.af.show=!S.af.show;showGate();return}
  if(t.id==='g-out'||t.id==='signout'){signOut();return}
  if(S.gate||!S.me)return;
  /* shared */
  if(t.id==='b-acct'){S.view=S.view==='main'?'account':S.view==='admin'?'account':'main';S.pick=null;paint();return}
  if(d.sug){chooseSug(d.sug,+d.i);return}
  if(d.pick){S.pick=S.pick===d.pick?null:d.pick;render();return}
  if(d.role){S.role=d.role;sset('kh-role',S.role);S.pick=null;S.pt=null;paint();return}
  /* driver */
  if(d.seat){S.seats=Math.max(1,Math.min(6,S.seats+(+d.seat)));render();return}
  if(d.route&&!S.confirmed){S.sel=+d.route;S.pt=null;paint();return}
  if(d.ride){S.dv='ride';S.rideId=d.ride;S.pt=null;paint();R=myRide(d.ride);if(R)fit([R.path]);return}
  if(d.acc){q=inReq(d.acc);if(q)setReq(q,'accepted','driver');return}
  if(d.rej){q=inReq(d.rej);if(q)setReq(q,'rejected','driver');return}
  if(d.track){startTrack(d.track);return}
  if(t.id==='untrack'){stopTrack();return}
  if(d.drop){q=inReq(d.drop);if(q)setReq(q,'cancelled','driver');return}
  /* rider */
  if(d.found){S.fsel=+d.found;paint();fit([S.found.ok[S.fsel].R.path]);return}
  if(d.req){openReq(d.req);return}
  if(d.rcancel){q=myReq(d.rcancel);if(q)setReq(q,'cancelled','rider');return}
  /* admin */
  if(d.ust){f.updateDoc(ref('users',d.u),{dstatus:d.ust}).then(loadAdmin).catch(fail(T('الحساب','account')));return}
  if(d.paid){var amt=r2(parseFloat(digits(S.pay[d.paid])));if(!(amt>0))return;
    f.addDoc(col('payments'),{driverId:d.paid,amount:amt,at:Date.now(),by:S.user.uid}).then(function(){S.pay[d.paid]='';loadAdmin()}).catch(fail(T('الدفعة','payment')));return}
  switch(t.id){
   case 'apply':
    if(S.af.car.trim().length<2||S.af.plate.trim().length<2){S.applyErr=T('اكتب نوع السيارة ورقم اللوحة.','Enter the car model and the plate number.');render();return}
    S.applyErr='';f.updateDoc(ref('users',S.user.uid),{car:S.af.car.trim(),plate:S.af.plate.trim(),dstatus:'pending'}).catch(fail(T('الطلب','request')));return;
   case 'newride':S.dv='new';resetNew();paint();return;
   case 'dhome':S.dv='home';S.pt=null;S.pick=null;paint();return;
   case 'go':
    if(!S.from.text.trim()||!S.to.text.trim()){S.formErr=T('حط من وين ولوين.','Enter both places.');render();return}
    if(depDate()<new Date()){S.formErr=T('هالساعة مرقت. اختار وقت جاي.','That time has passed. Pick a later time.');render();return}
    S.formErr='';S.busy=true;S.pick=null;render();
    computeRoutes().then(function(res){S.busy=false;S.routes=res.routes;S.dep=res.dep;S.sel=0;S.confirmed=false;S.pt=null;S.price=null;paint();fit(S.routes.map(function(r){return r.path}))})
     .catch(function(err){S.busy=false;var m=String(err&&err.message||err);
       if(m==='NO_ROUTE'||/NOT_FOUND|ZERO_RESULTS|geocod/i.test(m)){S.formErr=T('جوجل ما لقت طريق أو ما عرفت وحدة من المنطقتين. اختار من الاقتراحات أو حط النقطة عالخريطة.','Google found no route or did not recognise one of the places. Pick from the suggestions or set the point on the map.')}
       else showErr(T('ما قدرنا نجيب الطرقات','Could not get the routes'),m,explain(m));
       render()});
    return;
   case 'edit':S.routes=null;S.confirmed=false;S.pt=null;paint();return;
   case 'confirm':S.confirmed=true;paint();return;
   case 'unconfirm':S.confirmed=false;S.pt=null;paint();return;
   case 'publish':var r=S.routes[S.sel];
    if(S.dep<new Date()){S.formErr=T('ساعة الطلعة مرقت. اكبس "غيّر" واختار وقت جاي.','The departure time has passed. Tap "Edit" and pick a later time.');render();return}
    S.busy=true;render();
    f.addDoc(col('rides'),{driverId:S.user.uid,driverName:S.me.name,car:S.me.car||'',plate:S.me.plate||'',fromText:S.from.text,toText:S.to.text,dep:S.dep.getTime(),
      dur:r.dur,stat:r.stat,dist:r.dist,desc:r.desc||'',poly:r.enc,seats:S.seats,seatsLeft:S.seats,price:S.price||suggestPrice(r.dist),status:'open',createdAt:Date.now()})
     .then(function(doc){S.busy=false;S.dv='ride';S.rideId=doc.id;S.fresh=doc.id;resetNew();paint()}).catch(fail(T('نشر المشوار','posting the ride')));
    return;
   case 'cancelride':R=myRide(S.rideId);if(!R)return;if(S.track&&S.track.rideId===R.id)stopTrack();
    var b=f.writeBatch(db);b.update(ref('rides',R.id),{status:'cancelled'});
    reqsFor(R.id).forEach(function(x){if(x.status==='pending')b.update(ref('requests',x.id),{status:'rejected',by:'driver',updatedAt:Date.now()});else if(x.status==='accepted')b.update(ref('requests',x.id),{status:'cancelled',by:'driver',updatedAt:Date.now()})});
    b.commit().then(function(){S.dv='home';S.pt=null;paint()}).catch(fail(T('إلغاء المشوار','cancelling the ride')));return;
   case 'rgo':search();return;
   case 'redit':S.rv='home';S.found=null;paint();return;
   case 'rhome':S.rv=S.found?'results':'home';S.reqId=null;S.reqRide=null;paint();return;
   case 'rreq':var x=S.found.ok[S.fsel],m=x.m;R=x.R;S.rbusy=true;render();
    f.addDoc(col('requests'),{rideId:R.id,driverId:R.driverId,riderId:S.user.uid,riderName:S.me.name,driverName:R.driverName,car:R.car||'',plate:R.plate||'',
      rideFrom:R.fromText,rideTo:R.toText,dep:R.dep,puText:S.rfrom.text,drText:S.rto.text,pu:m.pu.pos,dr:m.dr.pos,puAt:m.puAt.getTime(),drAt:m.drAt.getTime(),km:Math.round(m.m),
      price:m.price,fee:r2(m.price*FEE),status:'pending',by:'rider',createdAt:Date.now(),updatedAt:Date.now()})
     .then(function(doc){S.rbusy=false;S.found=null;S.fresh=doc.id;openReq(doc.id,R.id)}).catch(fail(T('طلب المقعد','the seat request')));
    return;
   case 'toadmin':S.view='admin';render();loadAdmin();return;
   case 'adrefresh':loadAdmin();return;
   case 'sharekey':f.setDoc(ref('config','app'),{mapsKey:S.key}).catch(fail(T('المفتاح','key')));return;
   case 'unsharekey':S.localKey=S.localKey||S.key;sset('kh-key',S.localKey);f.setDoc(ref('config','app'),{mapsKey:''}).catch(fail(T('المفتاح','key')));return;
   case 'chkey':sdel('kh-key');location.reload();return;
  }
});

boot();
})();
</script>
</body>
</html>
