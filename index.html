<style>
/* Khedni trial. Accounts and shared rides live in Firebase; routes and traffic come from Google Maps. */
:root{color-scheme:only light;
  --bg:#F3F5F2;--surface:#FFFFFF;--ink:#0E1F1A;--muted:#4F5F59;--line:#DCE3DF;--seg:#E7ECE8;
  --brand:#0B5D4B;--brand-ink:#FFFFFF;--brand-soft:#D9EBE5;--brand-deep:#073F33;
  --sun:#F5B921;--sun-ink:#0E1F1A;--sun-soft:#FFF1C7;--sun-soft-ink:#3F3A22;
  --danger:#B3261E;--danger-soft:#FBE4E2;--route:#1A6FE0;
  --display:'IBM Plex Sans Arabic',Tahoma,'Segoe UI',sans-serif;--body:'IBM Plex Sans Arabic',Tahoma,'Segoe UI',sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column}
h1,h2,h3,p{margin:0}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.sub{font-size:12.5px;color:var(--muted)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:54px;padding:0 18px;border:0;border-radius:14px;font-size:16px;font-weight:700;width:100%}
.btn.pri{background:var(--brand);color:var(--brand-ink);box-shadow:0 3px 0 #063A2F}
.btn.sun{background:#F5A800;color:#0E1F1A;border:2px solid #B87E00;box-shadow:0 3px 0 #B87E00}
.btn.pri:active,.btn.sun:active{transform:translateY(2px);box-shadow:none}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.warn{background:transparent;border:1px solid var(--danger);color:var(--danger)}
.btn.sm{min-height:40px;width:auto;font-size:13px;border-radius:10px;padding:0 14px;flex:none}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.grow{flex:1 1 auto;min-width:0}
.col{display:flex;flex-direction:column;gap:12px}
h2{font-family:var(--display);font-size:16px;font-weight:600;overflow-wrap:anywhere}
h3{font-family:var(--display);font-size:14px;font-weight:600;margin-top:6px}
.ltr{direction:ltr;text-align:left}
[dir=rtl] input.ltr{text-align:right}

/* sign-in, profile and key screens */
#gate{flex:1 1 auto;display:flex;flex-direction:column;padding:28px 22px;background:var(--brand);color:#fff;overflow-y:auto}
.gwrap{margin:auto 0;display:flex;flex-direction:column;gap:16px;width:100%;max-width:460px;align-self:center}
#gate h1{font-family:var(--display);font-size:52px;line-height:1.1}
#gate p{color:rgba(255,255,255,.9)}
#gate label,.glbl{font-size:13px}
#gate input{width:100%;min-height:50px;padding:0 14px;border:0;border-radius:12px;background:#fff;color:var(--ink);font-size:15px}
#gate .gtag{display:block;font-family:var(--display);font-weight:600;font-size:19px;line-height:1.35;color:var(--sun);margin:2px 0 6px}
#gate .gintro{display:flex;flex-direction:column;gap:8px}
#gate .gi{display:flex;gap:12px;align-items:flex-start;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);border-radius:12px;padding:12px}
#gate .gi .ic{flex:none;width:36px;height:36px;border-radius:50%;border:1.5px solid rgba(245,185,33,.7);color:var(--sun);display:flex;align-items:center;justify-content:center}
#gate .gi b{display:block;color:#fff;font-family:var(--display);font-size:14.5px;font-weight:600}
#gate .gi span{color:rgba(255,255,255,.8);font-size:13px}
#gate a{color:#fff;text-decoration:underline;font-weight:600}
#gate .note{font-size:13px;color:rgba(255,255,255,.85)}
#gate .gerr{background:#fff;color:var(--danger);border-radius:12px;padding:10px 12px;font-size:14px;font-weight:500}
#gate .btn.ghost{border-color:rgba(255,255,255,.5);color:#fff}
#gate input[type=checkbox]{width:24px;height:24px;min-height:24px;flex:none;padding:0;accent-color:var(--sun)}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.5}
.lnk{background:none;border:0;padding:0;color:inherit;font:inherit;font-weight:600;text-decoration:underline}
.terms{margin:0;padding-inline-start:20px;display:flex;flex-direction:column;gap:10px;font-size:14px;line-height:1.6}
.terms b{display:block}
.tbl{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{padding:8px 4px;text-align:start;border-bottom:1px solid rgba(128,128,128,.35)}
.tbl th{font-weight:600}
#gate .seg{background:rgba(255,255,255,.16)}
#gate .seg button{color:#fff}
#gate .seg button[aria-pressed="true"]{background:#fff;color:var(--brand-deep)}
.pwrow{display:flex;gap:8px}
.pwrow button{flex:none;min-width:64px;min-height:54px;border:1px solid rgba(255,255,255,.5);border-radius:14px;background:transparent;color:#fff;font-size:14px}
.gload{display:flex;align-items:center;gap:12px;font-size:16px}

/* app */
#app{flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
.top{flex:none;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 14px 6px 10px;background:linear-gradient(160deg,#0E6E59,#0B5D4B 55%,#084A3C);border-bottom:0}
.top .chipbtn{width:56px;height:56px;min-height:56px;padding:0;border-radius:50%;display:inline-flex;flex-direction:column;gap:1px;align-items:center;justify-content:center;line-height:1.1;background:#FFFFFF;border:2px solid #F5B921;color:#0B5D4B;font-weight:700;font-size:12px;box-shadow:0 3px 8px rgba(0,0,0,.25)}
.top .chipbtn{position:relative}.nbadge{position:absolute;top:-4px;inset-inline-end:-4px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:#D93025;color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;border:2px solid #fff}
.top .chipbtn small{font-size:10px;font-weight:700}
.top .chipbtn:active{background:#FFF1C7;transform:translateY(1px)}
.brand{font-family:var(--display);font-size:22px;font-weight:700;color:var(--brand);display:flex;align-items:center}
.brand img{height:60px;width:auto;display:block}
#gate h1 img{height:96px;width:auto;max-width:100%;display:block;margin-inline-start:-4px}
#gate .ghead{display:flex;align-items:center;justify-content:space-between;gap:10px}
#gate .ghead h1{min-width:0;flex:0 1 auto}
#gate .glang{flex:none;width:64px;height:64px;border-radius:50%;background:#fff;border:2px solid var(--sun);color:var(--brand);font-weight:700;font-size:13px;box-shadow:0 3px 8px rgba(0,0,0,.25)}
#gate .glang:active{background:var(--sun-soft)}
.chipbtn{min-height:44px;padding:0 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface);font-size:13px;font-weight:600}
.mapwrap{position:relative;flex:1 1 36%;min-height:220px}
#map{position:absolute;inset:0}
.hint{position:absolute;top:10px;inset-inline:10px;padding:8px 12px;border-radius:12px;background:var(--ink);color:#fff;font-size:13px;text-align:center}
.sheet{flex:0 1 auto;max-height:62%;overflow-y:auto;display:flex;flex-direction:column;gap:12px;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--line);border-radius:22px 22px 0 0;margin-top:-16px;position:relative}
#app.full .mapwrap{display:none}
.mapbtn{position:absolute;left:10px;bottom:28px;z-index:3;min-height:44px;padding:0 14px;border-radius:999px;background:#fff;border:2px solid var(--sun);color:var(--brand);font-weight:700;font-size:13px;display:inline-flex;align-items:center;gap:6px;box-shadow:0 3px 8px rgba(0,0,0,.25)}
.mapbtn:active{background:var(--sun-soft)}
#app.bigmap .mapwrap,#app.pickmap .mapwrap{flex:1 1 80%}
#app.bigmap .sheet,#app.pickmap .sheet{max-height:26%}
#app.pickmap #mapbig{display:none}
#app.full .sheet{flex:1 1 auto;max-height:none;margin-top:0;border-radius:0;border-top:0}
.seg{display:flex;gap:4px;padding:4px;border-radius:999px;background:var(--seg)}
.seg button{flex:1 1 0;min-height:42px;border:0;border-radius:999px;background:transparent;font-size:14px;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink);font-weight:600}
.field{display:flex;flex-direction:column;gap:4px;min-width:0;position:relative}
.field label,.lbl{font-size:14px;font-weight:700;color:var(--ink)}
.inrow{display:flex;gap:8px}
.sheet input[type=text],.sheet input[type=time],.sheet input[type=date],.sheet input[type=number],.sheet select{width:100%;min-height:48px;padding:0 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);font-size:14px;font-weight:500}
.pinbtn{flex:none;width:48px;height:48px;border:1px solid var(--line);border-radius:12px;background:var(--surface);display:flex;align-items:center;justify-content:center;color:var(--brand)}
.pinbtn[aria-pressed="true"]{background:var(--sun);border-color:var(--sun);color:var(--sun-ink)}
.sug{list-style:none;margin:0;padding:4px;border:1px solid var(--line);border-radius:14px;background:var(--surface);display:flex;flex-direction:column;gap:2px}
.sug button{display:block;width:100%;min-height:44px;padding:8px 10px;border:0;border-radius:10px;background:none;text-align:start;font-size:14px}
.sug button:hover,.sug button:focus-visible{background:var(--seg)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.err{color:var(--danger);font-size:13px;font-weight:500}
.rcard{display:flex;flex-direction:column;gap:8px;width:100%;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--surface);text-align:start}
button.rcard[aria-pressed="true"],.rcard.on{border:2px solid var(--route);padding:13px}
.rcard .t{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.rcard .name{font-size:14px;font-weight:600;min-width:0;overflow-wrap:anywhere}
.rcard .dur{font-family:var(--display);font-size:20px;font-weight:600;color:var(--brand);flex:none;font-variant-numeric:tabular-nums}
.rcard .meta{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12.5px;color:var(--muted)}
.tag{display:inline-flex;align-items:center;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:600}
.tag.fast,.tag.ok{background:var(--brand-soft);color:var(--brand-deep)}
.tag.jam,.tag.wait{background:var(--sun-soft);color:var(--sun-soft-ink)}
.wantcard .when{display:flex;flex-direction:column;align-items:flex-end;flex:none;line-height:1.2}
.wantcard .when b{font-size:15px}.wantcard .when .dur{font-family:var(--display);font-size:22px;font-weight:700;color:var(--brand)}
.wantcard.hasoffer{border:2px solid #F5A800;background:#FFFBEF}
.offerhead{font-weight:700;font-size:15px}
.pnote{display:flex;gap:6px;align-items:flex-start;background:var(--sun-soft);color:var(--sun-soft-ink);border-radius:10px;padding:8px 10px;font-size:14px}
.offer{gap:8px;padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.btn.big{min-height:60px;font-size:20px}
.rcard .meta .day{color:var(--ink);font-size:14px}
.alert{display:inline-flex;align-self:flex-start;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font-size:13px;font-weight:600;line-height:1.6;max-width:100%}
.alert.msg{background:var(--brand);color:#fff}.alert.req{background:#F5A800;color:#0E1F1A}
.tag.no{background:var(--danger-soft);color:var(--danger)}
.banner{padding:10px 12px;border-radius:12px;background:var(--sun-soft);color:var(--sun-soft-ink);font-size:13.5px}
.okbox{padding:12px;border-radius:12px;background:var(--brand-soft);color:var(--brand-deep);font-size:13.5px}
.box{display:flex;flex-direction:column;gap:10px;padding:14px;border:1px solid var(--line);border-radius:14px}
.kv{display:flex;justify-content:space-between;gap:12px;font-size:13.5px}
.kv span:first-child{color:var(--muted)}
.kv b{font-weight:600;text-align:end;overflow-wrap:anywhere;min-width:0}
.big{font-family:var(--display);font-size:26px;font-weight:600;line-height:1;color:var(--brand);font-variant-numeric:tabular-nums}
.stepper{display:flex;align-items:center;justify-content:space-between;min-height:48px;padding:0 4px;border:1px solid var(--line);border-radius:14px}
.stepper button{width:44px;height:44px;border:0;border-radius:12px;background:var(--seg);font-size:20px;font-weight:600}
.stepper b{font-family:var(--display);font-size:18px}
.spin{width:22px;height:22px;border-radius:50%;border:3px solid rgba(255,255,255,.4);border-top-color:#fff;animation:rot 1s linear infinite;flex:none}
@keyframes rot{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:3s}}
.msgs{display:flex;flex-direction:column;gap:6px;max-height:210px;overflow-y:auto}
.msg{align-self:flex-start;max-width:85%;padding:6px 10px;border-radius:12px;background:var(--seg);font-size:14px;display:flex;flex-direction:column;overflow-wrap:anywhere}
.msg.me{align-self:flex-end;background:var(--brand-soft);color:var(--brand-deep)}
.msg small{font-size:11px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.days{display:grid;grid-template-rows:repeat(2,auto);grid-auto-flow:column;grid-auto-columns:calc((100% - 18px) / 4);gap:6px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding-bottom:2px;overscroll-behavior-x:contain}
.days::-webkit-scrollbar{display:none}
.days .chip{scroll-snap-align:start}
.dayshint{font-size:12px;color:var(--muted);margin-top:2px}
.days .chip{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px;line-height:1.25;min-height:54px;border-radius:12px;font-size:14px;font-weight:700}
.days .chip small{font-size:12px;font-weight:500;color:var(--muted)}
.tw{position:relative;display:flex;justify-content:center;align-items:center;gap:4px;height:168px;border:1px solid var(--line);border-radius:16px;background:var(--surface);overflow:hidden;direction:ltr;user-select:none}
.twcol{height:168px;width:92px;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;position:relative;z-index:1;outline:none}
.twcol::-webkit-scrollbar{display:none}
.twcol div{height:56px;line-height:56px;text-align:center;font-size:30px;font-weight:700;scroll-snap-align:center;color:var(--muted);font-variant-numeric:tabular-nums;cursor:pointer}
.twcol div.on{color:var(--ink);font-size:36px}
.twcol:focus-visible{box-shadow:inset 0 0 0 2px var(--sun)}
.twsep{font-size:34px;font-weight:700;z-index:1}
.twband{position:absolute;left:10px;right:10px;top:56px;height:56px;border-radius:12px;background:var(--sun-soft);pointer-events:none}
.tw::before,.tw::after{content:"";position:absolute;left:0;right:0;height:56px;z-index:2;pointer-events:none}
.tw::before{top:0;background:linear-gradient(var(--surface),transparent)}.tw::after{bottom:0;background:linear-gradient(transparent,var(--surface))}
.tw.unset .twcol div{opacity:.4}.tw.unset .twband{background:var(--seg)}
.twcap{display:flex;justify-content:center;gap:64px;font-size:12px;color:var(--muted);margin-top:4px;direction:ltr}
.days .chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.days .chip[aria-pressed="true"] small{color:var(--brand-ink)}
.chip{min-height:44px;padding:0 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface);font-size:13px;font-weight:500}
.face{border-radius:50%;object-fit:cover;flex:none;background:var(--seg);color:var(--muted);display:inline-flex;align-items:center;justify-content:center;overflow:hidden}
#errbox{position:fixed;inset-inline:10px;bottom:10px;z-index:50;max-height:60%;overflow:auto;padding:14px;border-radius:16px;background:var(--danger-soft);color:var(--ink);border:2px solid var(--danger);display:flex;flex-direction:column;gap:8px}
#errbox h3{font-size:16px;color:var(--danger);margin:0}
#errbox pre{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px;direction:ltr;text-align:left;background:#fff;border-radius:10px;padding:8px}
.ico{display:inline-block;vertical-align:-3px;flex:none}
.free .kv:has(.mny),.free .cost,.free .mny,.free .ledger{display:none!important}
.free .adm .kv:has(.mny){display:flex!important}.free .adm .mny{display:inline!important}
.freeonly{display:none!important}.free .freeonly{display:block!important}
.star{background:none;border:0;font-size:34px;line-height:1;color:#C9D2CE;padding:2px 4px;min-width:44px;min-height:44px}.star:hover,.star:focus-visible{color:var(--sun)}.stars{display:flex;justify-content:center;gap:2px}
.chips .chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
</style>
</head>

<section id="app" hidden>
  <div class="top">

/* ---------- live location: the driver shares it, a confirmed rider watches it ---------- */
// A web page can only read the position while it is open and on screen, so the driver's screen is kept awake.
var wake=null;
function keepAwake(){try{if(S.track&&navigator.wakeLock&&document.visibilityState==='visible')navigator.wakeLock.request('screen').then(function(w){wake=w}).catch(function(){})}catch(e){}}
document.addEventListener('visibilitychange',keepAwake);
function sendLive(on){var t=S.track;if(!t||!S.user)return;
  var d=t.col==='live'?{driverId:S.user.uid,riders:S.inReqs.filter(function(q){return q.rideId===t.docId&&q.status==='accepted'}).map(function(q){return q.riderId})}:{riderId:S.user.uid,driverId:t.to};
  d.on=on;d.at=Date.now();
  if(on&&t.pos){d.lat=t.pos.lat;d.lng=t.pos.lng}
  t.sent=d.at;t.sentPos=t.pos;
  F.f.setDoc(ref(t.col,t.docId),d).catch(function(e){if(!t.failed){t.failed=true;dbErr(T('مشاركة الموقع','location sharing'),e)}})}
function startTrack(col,docId,to){
  if(!navigator.geolocation){S.trackErr=T('هالمتصفح ما بيعطي الموقع. افتح الصفحة بـChrome.','This browser does not give a location. Open the page in Chrome.');render();return}
  if(S.track)stopTrack();
  S.trackErr='';var t=S.track={col:col,docId:docId,to:to||null,pos:null,sent:0,sentPos:null,id:null,timer:0,failed:false};
  // send every 10 s while moving and every 30 s while stopped; the timer covers a phone that reports no new fix
  var due=function(){if(S.track!==t||!t.pos)return;var gap=Date.now()-t.sent,moved=t.sentPos?hav(t.sentPos,t.pos):1e9;if(gap>=30000||(gap>=10000&&moved>15))sendLive(true)};
  t.timer=setInterval(due,5000);
  t.id=navigator.geolocation.watchPosition(function(p){if(S.track!==t)return;
      t.pos={lat:p.coords.latitude,lng:p.coords.longitude};S.trackErr='';
      due();paint()},
    function(e){if(S.track!==t)return;
      if(e.code===1){stopTrack();S.trackErr=T('الموقع ممنوع عن هالصفحة. اكبس على القفل حد عنوان الموقع، اسمح بالـLocation، وجرّب مرة تانية. إذا الصفحة مفتوحة جوّا تطبيق تاني، افتحها بـChrome.','Location is blocked for this page. Tap the lock next to the address, allow Location, and try again. If the page is open inside another app, open it in Chrome.')}
      else S.trackErr=T('ما قدرنا نحدّد موقعك. تأكد إنو الـGPS شغّال.','Could not get your position. Check that GPS is on.');
      render()},
    {enableHighAccuracy:true,maximumAge:5000,timeout:30000});
  keepAwake();paint()}
function stopTrack(){var t=S.track;if(!t)return;clearInterval(t.timer);try{navigator.geolocation.clearWatch(t.id)}catch(e){}
  t.pos=null;t.failed=true;sendLive(false);S.track=null;try{if(wake){wake.release();wake=null}}catch(e){}paint()}
// the driver's side: positions shared by the confirmed riders of the ride on screen
var RL={};
function unwatchRL(){Object.keys(RL).forEach(function(id){try{RL[id]()}catch(e){}});RL={};S.rl={}}
function syncRL(){var want={};
  if(S.me&&S.view==='main'&&S.role==='driver'&&S.dv==='ride')reqsFor(S.rideId).forEach(function(q){if(q.status==='accepted')want[q.id]=1});
  Object.keys(RL).forEach(function(id){if(!want[id]){try{RL[id]()}catch(e){}delete RL[id];delete S.rl[id]}});
  Object.keys(want).forEach(function(id){if(RL[id])return;
    var un=RL[id]=F.f.onSnapshot(ref('rlive',id),function(s){if(RL[id]!==un)return;if(s.exists())S.rl[id]=s.data();else delete S.rl[id];paint()},
      function(){if(RL[id]!==un)return;delete S.rl[id];var hold=RL[id]=function(){};setTimeout(function(){if(RL[id]===hold)delete RL[id]},15000)})})}
function rlInfo(q){var L=S.rl[q.id];if(!L||!L.on||L.lat==null)return null;var age=Date.now()-L.at;if(age>10*60000)return null;var pos={lat:L.lat,lng:L.lng};return {pos:pos,age:age,d:hav(pos,q.pu)}}
var liveUnsub=null,liveId=null;
function unwatchLive(){if(liveUnsub){try{liveUnsub()}catch(e){}}liveUnsub=null;liveId=null;S.live=null}
function syncLive(){var q=S.me&&S.view==='main'&&S.role==='rider'&&S.rv==='req'?myReq(S.reqId):null,id=q&&q.status==='accepted'?q.rideId:null;
  if(id===liveId)return;unwatchLive();if(!id)return;liveId=id;
  liveUnsub=F.f.onSnapshot(ref('live',id),function(s){if(liveId!==id)return;S.live=s.exists()?s.data():null;paint()},
    function(){if(liveId!==id)return;S.live=null;liveUnsub=null;setTimeout(function(){if(liveId===id&&!liveUnsub){liveId=null;paint()}},15000)})}
// where the car is for this rider: straight-line distance, and when the route is known, distance and time left along it
function liveInfo(q){var L=S.live;if(!L||!L.on||L.lat==null)return null;var age=Date.now()-L.at;if(age>10*60000)return null;
  var pos={lat:L.lat,lng:L.lng},o={pos:pos,age:age,d:hav(pos,q.pu),left:null,eta:null},R=S.reqRide;
  if(R&&R.id===q.rideId&&R.path.length>1){var c=nearestOnPath(R,pos),p=nearestOnPath(R,q.pu);
    if(c.d<1500){o.left=p.cum-c.cum;if(o.left>0)o.eta=new Date(Date.now()+o.left/total(R)*R.dur*1000)}}
  return o}
setInterval(function(){if(!S.gate&&(liveId||Object.keys(RL).length))paint()},15000);

var TERMS=[
 ['شو هي خدني','خدني منصّة بتعرّف صاحب سيارة نازل عطريقه على شريك رايح بنفس الاتجاه. خدني مش شركة نقل: ما بتملك سيارات، ما بتوظّف أصحاب سيارات، وما بتحدّد الطريق ولا الوقت.',
  'What Khedni is','Khedni is a platform that introduces a car owner already making a trip to a road partner going the same way. Khedni is not a transport company: it owns no cars, employs no car owners, and sets neither the route nor the time.'],
 ['المشوار اتفاق بينكم','كل مشوار هو اتفاق مباشر بين صاحب السيارة وشريك الطريق، وبيصير على مسؤوليتهم. الطرفين أحرار يقبلوا أو يرفضوا أي طلب.',
  'The ride is between you','Every ride is a direct agreement between the car owner and the road partner, made at their own responsibility. Either may accept or decline any request.'],
 ['تقاسم كلفة، مش أجرة','المبلغ اللي بيدفعه شريك الطريق هو مشاركة بكلفة المشوار (بنزين، صيانة، واستهلاك سيارة)، مش أجرة نقل. خدني بتحسبه سلفاً حسب المسافة وبتبيّنه للطرفين قبل المشوار، ليعرف كل واحد قدّيش بيشارك: لا أكتر ولا أقل. الكلفة بتتقسّم على كل اللي بالسيارة، فكل ما زاد عدد شركاء الطريق بتنقص مشاركة كل واحد. صاحب السيارة فيه ينقّص المبلغ وما فيه يزيده. ممنوع استعمال خدني كشغل نقل بأجرة أو للربح من نقل شركاء الطريق.',
  'Cost sharing, not a fare','What the road partner pays is a share of the trip’s cost (fuel, maintenance and wear), not a transport fare. Khedni works it out in advance from the distance and shows it to both sides before the trip, so each knows what they share: no more and no less. The cost is split between everyone in the car, so each share falls as more road partners join. The car owner may lower the amount but not raise it. Using Khedni as a paid transport job or to profit from carrying people is not allowed.'],
 ['شو يعني «شفنا الأوراق»','لما خدني بتوافق على صاحب سيارة، يعني بس إنّو قدّم الأوراق المطلوبة (صورة وجّه، دفتر السواقة، ودفتر السيارة أو عقد الإيجار) والإدارة شافتها. هيدا مش شهادة إنّه منيح أو مأمون، ومش ضمانة إنّ الأوراق صحيحة. خدني ما بتقدر تتأكّد إذا الأوراق مزوّرة أو منتهية أو مش إله. صاحب السيارة وحده مسؤول عن صحّة الأوراق اللي قدّمها وعن سواقته وسلوكه، وأي مسؤولية عن أوراق غلط أو مزوّرة عليه هوّي، مش على خدني. شريك الطريق بيقرّر بنفسه إذا بدّه يطلع.',
  'What “papers checked” means','When Khedni approves a car owner it only means they submitted the required papers (face photo, driving licence, and car registration or rental contract) and the admin looked at them. It is not a statement that they are a good or safe person, nor a guarantee that the papers are genuine. Khedni cannot confirm whether papers are forged, expired or not theirs. The car owner alone is responsible for the papers they submitted and for their driving and conduct; any liability for false or forged papers is theirs, not Khedni’s. The road partner decides for themselves whether to ride.'],
 ['تعهّد صاحب السيارة','صاحب السيارة بيأكّد إنو معه دفتر سواقة صالح، وإنو السيارة مسجّلة وميكانيكها ماشي وعليها تأمين ساري بيغطّي شركاء الطريق، وإنو بيلتزم بقانون السير وما بيسوق تعبان أو تحت تأثير كحول أو مخدّرات.',
  'The car owner’s undertaking','The car owner confirms that they hold a valid driving licence, that the car is registered, roadworthy and covered by valid insurance that includes people, and that they follow traffic law and never drive tired or under the influence of alcohol or drugs.'],
 ['التأمين','تأمين السيارة وشركاء الطريق على مسؤولية صاحب السيارة وحده. خدني ما بتقدّم أي تأمين. شريك الطريق بيطلع وهو عارف هالشي.',
  'Insurance','Insuring the car and its people is the car owner’s responsibility alone. Khedni provides no insurance. The road partner travels knowing this.'],
 ['الحوادث والأضرار','ضمن اللي بيسمح فيه القانون، خدني مش مسؤولة عن أي حادث، إصابة، ضرر، سرقة، تأخير، إلغاء، أو تصرّف من أي مستخدم قبل المشوار أو خلاله أو بعده. المسؤولية على صاحب السيارة وشريك الطريق.',
  'Accidents and damage','To the extent the law allows, Khedni is not responsible for any accident, injury, damage, theft, delay, cancellation or conduct of any user before, during or after a ride. Responsibility lies with the car owner and the road partner.'],
 ['السلوك','الاحترام واجب. ممنوع التحرّش، العنف، التهديد، التمييز، أو طلب مصاري زيادة عن المتّفق عليه. الإدارة بتقدر توقّف أي حساب بيخالف، وبتبلّغ السلطات إذا لزم.',
  'Conduct','Respect is required. Harassment, violence, threats, discrimination or asking for more money than agreed are forbidden. The admin may suspend any account that breaks this and may report to the authorities.'],
 ['العمر والمعلومات الصحيحة','لازم يكون عمرك 18 سنة أو أكتر، والاسم والرقم والصورة وأوراق السيارة اللي بتحطّهم يكونوا إلك وصحيحين.',
  'Age and true information','You must be 18 or older, and the name, number, photo and car details you give must be your own and true.'],
 ['رسم خدني','خدني بتاخد 10% من حصة صاحب السيارة عن كل شريك مأكّد. شريك الطريق ما بيدفع رسم لخدني. بهالنسخة التجريبية الدفع كاش بين شريك الطريق وصاحب السيارة.',
  'Khedni’s fee','Khedni takes 10% of the car owner’s share for each confirmed road partner. The road partner pays Khedni nothing. In this trial version payment is in cash between road partner and car owner.'],
 ['معلوماتك','منحفظ اسمك، رقمك، صورتك، سيارتك ومشاويرك. صاحب السيارة بيرفع صورة دفتر سواقته ودفتر سيارته (وهويته إذا بدّه)، ومنحتفظ فيهم كسجلّ، وما حدا بيشوفهم غير صاحبهم والإدارة. رقمك بتشوفه الإدارة بس. صورتك واسمك بيشوفهم اللي طالع معك. موقعك بينبعت بس لما إنت تكبس "شارك موقعي"، وبس للطرف التاني بالمشوار. ممكن نسلّم معلومات للسلطات إذا القانون طلب.',
  'Your information','We store your name, number, photo, car and rides. A car owner uploads photos of their driving licence and car papers (and ID if they wish); we keep them on record, and only their owner and the admin can see them. Only the admin sees your number. The person you ride with sees your photo and name. Your location is sent only when you tap “share my location”, and only to the other party of that ride. We may hand information to the authorities when the law requires.'],
 ['الأوقات تقريبية','أوقات الوصول والعجقة جايين من خرائط جوجل وهنّي تقديرات، مش ضمانة.',
  'Times are estimates','Arrival and traffic times come from Google Maps and are estimates, not guarantees.'],
 ['نسخة تجريبية','هيدي نسخة تجريبية. الشروط ممكن تتغيّر، وساعتها منطلب موافقتك من جديد. القانون اللبناني هو المطبّق.',
  'Trial version','This is a trial version. The terms may change, and we will then ask for your agreement again. Lebanese law applies.']
];
function termsHTML(){return '<ol class="terms">'+TERMS.map(function(t){return '<li><b>'+T(t[0],t[2])+'</b>'+T(t[1],t[3])+'</li>'}).join('')+'</ol><p class="sub" style="color:inherit;opacity:.8">'+T('مسودة تجريبية · النسخة ','Trial draft · version ')+TERMS_V+'</p>'}

  return '<div class="col"><p>'+T('خدني مش شغل نقل. صاحب السيارة نازل عطريقه أصلاً، واللي بيطلع معه بيشاركه بكلفة المشوار: بنزين، صيانة، واستهلاك سيارة.','Khedni is not a ride-for-hire service. The car owner is making the trip anyway, and whoever rides along shares its cost: fuel, maintenance and wear.')+'</p>'+

var AG={};
function agreeLocal(uid){AG[uid]=1;sset('kh-terms-'+uid,String(TERMS_V))}
function agreeRemote(uid){F.f.setDoc(ref('consents',uid),{v:TERMS_V,at:Date.now()}).catch(function(){})}
function hasAgreed(uid){return !!AG[uid]||sget('kh-terms-'+uid)===String(TERMS_V)}
function checkConsent(){var uid=S.user.uid,local=hasAgreed(uid);S.agreed=local?true:null;

    if(wat<new Date()){S.wErr=T('هالساعة مرقت. اختار ساعة جاية.','That time has passed. Pick a later one.');render();return}
    S.wErr='';S.rbusy=true;render();
    f.addDoc(col('wants'),{riderId:S.user.uid,riderName:S.me.name,grp:S.me.grp||'',fromText:S.rfrom.text,toText:S.rto.text,from:{lat:S.rfrom.lat,lng:S.rfrom.lng},to:{lat:S.rto.lat,lng:S.rto.lng},at:wat.getTime(),note:String(S.note||'').trim().slice(0,100),status:'open',createdAt:Date.now()})
     .then(function(doc){S.rbusy=false;S.wform=false;S.note='';if(doc)notify('want',doc.id);paint()}).catch(fail(T('نشر الطلب','posting the request')));return;
   case 'redit':S.rv='home';S.found=null;S.wform=false;paint();return;
   case 'rhome':unwatchRide();S.rv=S.found?'results':'home';S.reqId=null;S.reqRide=null;paint();return;
   case 'rreq':var x=S.found.ok[S.fsel],m=x.m;R=x.R;S.rbusy=true;render();
    f.addDoc(col('requests'),{rideId:R.id,driverId:R.driverId,riderId:S.user.uid,riderName:S.me.name,riderGrp:S.me.grp||'',driverName:R.driverName,car:R.car||'',plate:R.plate||'',
      rideFrom:R.fromText,rideTo:R.toText,dep:R.dep,puText:S.rfrom.text,drText:S.rto.text,from:{lat:S.rfrom.lat,lng:S.rfrom.lng},pu:m.pu.pos,dr:m.dr.pos,puAt:m.puAt.getTime(),drAt:m.drAt.getTime(),km:Math.round(m.m),
      price:m.price,fee:r2(m.price*FEE),note:String(S.note||'').trim().slice(0,100),status:'pending',by:'rider',createdAt:Date.now(),updatedAt:Date.now()})
     .then(function(doc){S.rbusy=false;S.found=null;S.note='';S.fresh=doc.id;notify('req',doc.id);openReq(doc.id,R.id)}).catch(fail(T('طلب المقعد','the seat request')));
    return;
   case 'viewshare':S.view='share';render();$('#sheet').scrollTop=0;return;
   case 'viewterms':S.view='terms';render();$('#sheet').scrollTop=0;return;
   case 'toadmin':S.view='admin';render();loadAdmin();return;
   case 'adrefresh':loadAdmin();return;
   case 'costtoggle':f.setDoc(ref('config','app'),{costOn:!costOn()},{merge:true}).catch(fail(T('المبالغ','amounts')));return;
   case 'feetoggle':var on=!feeOn();if(on&&!confirm(T('أكيد بدّك تشغّل الرسم؟ أصحاب السيارات رح يصير لازم يدفعوا 10%.','Switch the fee on? Car owners will have to pay 10%.')))return;
    f.setDoc(ref('config','app'),{feeOn:on},{merge:true}).catch(fail(T('رسم خدني','Khedni fee')));return;
   case 'savenotify':var nu=String(S.nuDraft!=null?S.nuDraft:(S.cfg&&S.cfg.notifyUrl)||'').trim();if(nu&&!/^https:\/\/[\w.-]+\.run\.app(\/[\w-]*)?$|^https:\/\/[\w.-]+\.cloudfunctions\.net\/[\w-]+$/.test(nu)){alert(T('الرابط لازم يبلّش بـ https وينتهي بـ run.app','The link must start with https and end in run.app'));return}
    f.setDoc(ref('config','app'),{notifyUrl:nu},{merge:true}).then(function(){S.nuDraft=null;render()}).catch(fail(T('الإشعارات','notifications')));return;
   case 'pushon':enablePush(true);return;
   case 'pushno':sset('kh-push-no','1');render();return;
   case 'savewhish':var wn=digits(S.whDraft!=null?S.whDraft:(S.cfg&&S.cfg.whish)||'').replace(/[^\d+ ]/g,'').trim();
    f.setDoc(ref('config','app'),{whish:wn},{merge:true}).then(function(){S.whDraft=null;render()}).catch(fail('Whish'));return;
   case 'sharekey':f.setDoc(ref('config','app'),{mapsKey:S.key},{merge:true}).catch(fail(T('المفتاح','key')));return;
   case 'unsharekey':S.localKey=S.localKey||S.key;sset('kh-key',S.localKey);f.setDoc(ref('config','app'),{mapsKey:''},{merge:true}).catch(fail(T('المفتاح','key')));return;
   case 'chkey':sdel('kh-key');location.reload();return;
  }
});

boot();
})();

// installable app: the service worker only adds offline opening; updates still come straight from the site
if('serviceWorker' in navigator&&location.protocol==='https:'&&!/kh\.test$/.test(location.hostname))window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})});
</script>
